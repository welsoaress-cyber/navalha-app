<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
<style>
  :root {
    --primary: #D4A843;
    --primary-dark: #b8912e;
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E8E4DC;
    --ink: #0F172A;
    --ink-2: #475569;
    --ink-3: #94A3B8;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  .shop-logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--primary); display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; font-weight: 800; font-family: 'Sora', sans-serif;
    overflow: hidden; flex-shrink: 0;
  }
  .shop-logo img { width: 100%; height: 100%; object-fit: cover; }
  .shop-info h1 { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .shop-info p { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  /* PROGRESS */
  .progress-bar {
    background: var(--surface);
    padding: 14px 20px 0;
    display: flex; gap: 6px; justify-content: center;
  }
  .step-dot {
    height: 4px; border-radius: 2px; flex: 1; max-width: 56px;
    background: var(--border); transition: background 0.3s;
  }
  .step-dot.done { background: var(--primary); }
  .step-dot.active { background: var(--primary); opacity: 0.5; }

  /* MAIN */
  .main { padding: 20px; max-width: 480px; margin: 0 auto; }

  .step { display: none; }
  .step.active { display: block; }

  .step-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--primary); margin-bottom: 6px;
  }
  .step-title {
    font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800;
    margin-bottom: 20px; line-height: 1.25;
  }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 14px;
  }
  .card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
  .card.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 6%, white); }
  .card-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .card-icon img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
  .card-body { flex: 1; }
  .card-name { font-weight: 600; font-size: 15px; }
  .card-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .card-price {
    font-size: 13px; font-weight: 700; color: var(--primary);
    white-space: nowrap;
  }

  /* CALENDAR */
  .week-scroll {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .week-scroll::-webkit-scrollbar { display: none; }
  .day-btn {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 2px solid var(--border); background: var(--surface);
    cursor: pointer; transition: all 0.18s; min-width: 56px;
  }
  .day-btn .day-name { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .day-btn .day-num { font-size: 20px; font-weight: 700; font-family: 'Sora', sans-serif; color: var(--ink); }
  .day-btn .day-month { font-size: 10px; color: var(--ink-3); }
  .day-btn.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, white); }
  .day-btn.selected .day-num { color: var(--primary); }
  .day-btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* TIME SLOTS */
  .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .slot {
    border: 2px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); padding: 10px 4px;
    text-align: center; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.18s; color: var(--ink);
  }
  .slot:hover { border-color: var(--primary); }
  .slot.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, white); color: var(--primary); }
  .slot.taken { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; pointer-events: none; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; padding: 14px 16px; border-radius: var(--radius-sm);
    border: 2px solid var(--border); font-size: 16px; font-family: inherit;
    background: var(--surface); color: var(--ink); outline: none;
    transition: border-color 0.18s;
  }
  .form-input:focus { border-color: var(--primary); }

  /* SUMMARY CARD */
  .summary-box {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  }
  .summary-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .summary-row:last-child { margin-bottom: 0; }
  .summary-label { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .summary-value { font-size: 14px; font-weight: 600; text-align: right; }

  /* BOTÕES */
  .btn-primary {
    width: 100%; padding: 16px; border-radius: var(--radius-sm);
    background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
    border: none; cursor: pointer; font-family: inherit; transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-back {
    background: none; border: none; color: var(--ink-3); font-size: 14px;
    cursor: pointer; font-family: inherit; padding: 4px 0; margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-back:hover { color: var(--ink); }

  /* CONFIRMAÇÃO */
  .confirm-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: color-mix(in srgb, var(--primary) 12%, white);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; margin: 0 auto 20px;
  }
  .confirm-title { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .confirm-sub { text-align: center; color: var(--ink-2); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

  /* SUSPENDED */
  .suspended-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60dvh; padding: 32px; text-align: center;
  }
  .suspended-icon { font-size: 48px; margin-bottom: 16px; }
  .suspended-title { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .suspended-sub { color: var(--ink-2); font-size: 14px; }

  /* LOADING */
  .loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 60dvh; font-size: 14px; color: var(--ink-3);
  }
  .spinner {
    width: 24px; height: 24px; border: 3px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--ink-3); padding: 32px 0; font-size: 14px; }
  .section-sep { height: 1px; background: var(--border); margin: 20px 0; }
  .barber-section-title { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header" id="header">
  <div class="shop-logo" id="shopLogo">…</div>
  <div class="shop-info">
    <h1 id="shopName">Carregando…</h1>
    <p id="shopSub">Agendamento online</p>
  </div>
</header>

<!-- PROGRESS -->
<div class="progress-bar" id="progressBar">
  <div class="step-dot" id="dot1"></div>
  <div class="step-dot" id="dot2"></div>
  <div class="step-dot" id="dot3"></div>
  <div class="step-dot" id="dot4"></div>
  <div class="step-dot" id="dot5"></div>
</div>

<!-- MAIN -->
<main class="main" id="main">
  <div class="loading" id="loadingState">
    <div class="spinner"></div> Carregando…
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
const state = {
  shop: null,
  barbers: [],
  services: [],
  availability: [],
  selectedService: null,
  selectedBarber: null,
  selectedDate: null,
  selectedTime: null,
  clientName: '',
  clientPhone: '',
  step: 1,
  totalSteps: 5
}

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
async function init() {
  const slug = getSlug()

  // Busca barbearia
  const { data: shops } = await db.from('barbershops').select('*').eq('slug', slug).single()

  if (!shops) {
    document.getElementById('main').innerHTML = `
      <div class="suspended-screen">
        <div class="suspended-icon">🔍</div>
        <div class="suspended-title">Barbearia não encontrada</div>
        <div class="suspended-sub">Verifique o endereço e tente novamente.</div>
      </div>`
    document.getElementById('progressBar').style.display = 'none'
    return
  }

  if (shops.status === 'suspended') {
    document.getElementById('main').innerHTML = `
      <div class="suspended-screen">
        <div class="suspended-icon">⏸️</div>
        <div class="suspended-title">Agendamentos pausados</div>
        <div class="suspended-sub">Esta barbearia está temporariamente indisponível.<br>Entre em contato diretamente com eles.</div>
      </div>`
    document.getElementById('progressBar').style.display = 'none'
    return
  }

  state.shop = shops

  // Aplica cor primária da barbearia
  document.documentElement.style.setProperty('--primary', shops.primary_color || '#D4A843')
  document.documentElement.style.setProperty('--primary-dark', shops.primary_color || '#b8912e')

  // Header
  document.getElementById('shopName').textContent = shops.name
  const logoEl = document.getElementById('shopLogo')
  if (shops.logo_url) {
    logoEl.innerHTML = `<img src="${shops.logo_url}" alt="${shops.name}">`
  } else {
    logoEl.textContent = shops.name.charAt(0).toUpperCase()
  }
  document.title = `Agendar — ${shops.name}`

  // Busca barbeiros e serviços
  const [{ data: barbers }, { data: services }, { data: avail }] = await Promise.all([
    db.from('barbers').select('*').eq('barbershop_id', shops.id).eq('active', true),
    db.from('services').select('*').eq('barbershop_id', shops.id).eq('active', true),
    db.from('availability').select('*, barbers!inner(barbershop_id)').eq('barbers.barbershop_id', shops.id)
  ])

  state.barbers = barbers || []
  state.services = services || []
  state.availability = avail || []

  renderStep(1)
}

// ────────────────────────────────────────────────
// PROGRESS
// ────────────────────────────────────────────────
function updateProgress(step) {
  for (let i = 1; i <= 5; i++) {
    const dot = document.getElementById(`dot${i}`)
    dot.className = 'step-dot' + (i < step ? ' done' : i === step ? ' active' : '')
  }
}

// ────────────────────────────────────────────────
// STEPS
// ────────────────────────────────────────────────
function renderStep(step) {
  state.step = step
  updateProgress(step)
  const main = document.getElementById('main')

  if (step === 1) renderServices(main)
  else if (step === 2) renderBarbers(main)
  else if (step === 3) renderCalendar(main)
  else if (step === 4) renderSlots(main)
  else if (step === 5) renderClientForm(main)
}

function backBtn(step) {
  return `<button class="btn-back" onclick="renderStep(${step})">← Voltar</button>`
}

// ── STEP 1: Serviços ──
function renderServices(main) {
  if (!state.services.length) {
    main.innerHTML = `<div class="empty">Nenhum serviço cadastrado ainda.</div>`
    return
  }
  main.innerHTML = `
    <div class="step active">
      <div class="step-label">Passo 1 de 5</div>
      <div class="step-title">Qual serviço você quer?</div>
      <div class="cards" id="serviceCards"></div>
    </div>`

  const container = document.getElementById('serviceCards')
  state.services.forEach(s => {
    const el = document.createElement('div')
    el.className = 'card' + (state.selectedService?.id === s.id ? ' selected' : '')
    el.innerHTML = `
      <div class="card-icon">✂️</div>
      <div class="card-body">
        <div class="card-name">${s.name}</div>
        <div class="card-sub">${s.duration_minutes} min</div>
      </div>
      ${s.price > 0 ? `<div class="card-price">R$ ${Number(s.price).toFixed(2).replace('.', ',')}</div>` : ''}`
    el.onclick = () => { state.selectedService = s; renderStep(2) }
    container.appendChild(el)
  })
}

// ── STEP 2: Barbeiros ──
function renderBarbers(main) {
  if (state.barbers.length === 1) {
    state.selectedBarber = state.barbers[0]
    renderStep(3)
    return
  }

  main.innerHTML = `
    <div class="step active">
      ${backBtn(1)}
      <div class="step-label">Passo 2 de 5</div>
      <div class="step-title">Escolha o barbeiro</div>
      <div class="cards" id="barberCards"></div>
    </div>`

  const container = document.getElementById('barberCards')

  const anyEl = document.createElement('div')
  anyEl.className = 'card' + (!state.selectedBarber ? ' selected' : '')
  anyEl.innerHTML = `
    <div class="card-icon">🎲</div>
    <div class="card-body">
      <div class="card-name">Qualquer disponível</div>
      <div class="card-sub">Primeiro horário livre</div>
    </div>`
  anyEl.onclick = () => { state.selectedBarber = null; renderStep(3) }
  container.appendChild(anyEl)

  state.barbers.forEach(b => {
    const el = document.createElement('div')
    el.className = 'card' + (state.selectedBarber?.id === b.id ? ' selected' : '')
    el.innerHTML = `
      <div class="card-icon">${b.photo_url ? `<img src="${b.photo_url}">` : '💈'}</div>
      <div class="card-body">
        <div class="card-name">${b.name}</div>
        <div class="card-sub">Disponível</div>
      </div>`
    el.onclick = () => { state.selectedBarber = b; renderStep(3) }
    container.appendChild(el)
  })
}

// ── STEP 3: Data ──
function renderCalendar(main) {
  main.innerHTML = `
    <div class="step active">
      ${backBtn(state.barbers.length <= 1 ? 1 : 2)}
      <div class="step-label">Passo 3 de 5</div>
      <div class="step-title">Quando você vem?</div>
      <div class="week-scroll" id="weekScroll"></div>
    </div>`

  const scroll = document.getElementById('weekScroll')
  const today = new Date()
  today.setHours(0,0,0,0)

  for (let i = 0; i < 30; i++) {
    const d = new Date(today)
    d.setDate(today.getDate() + i)
    const dow = d.getDay()

    const relevantBarbers = state.selectedBarber ? [state.selectedBarber] : state.barbers
    const hasAvail = relevantBarbers.some(b =>
      state.availability.some(a => a.barber_id === b.id && a.day_of_week === dow)
    )

    const btn = document.createElement('div')
    const dateStr = d.toISOString().slice(0,10)
    btn.className = 'day-btn' +
      (!hasAvail ? ' disabled' : '') +
      (state.selectedDate === dateStr ? ' selected' : '')
    btn.innerHTML = `
      <span class="day-name">${DIAS[dow]}</span>
      <span class="day-num">${d.getDate()}</span>
      <span class="day-month">${MESES[d.getMonth()]}</span>`

    if (hasAvail) {
      btn.onclick = () => { state.selectedDate = dateStr; renderStep(4) }
    }
    scroll.appendChild(btn)
  }
}

// ── STEP 4: Horário ──
async function renderSlots(main) {
  main.innerHTML = `
    <div class="step active">
      ${backBtn(3)}
      <div class="step-label">Passo 4 de 5</div>
      <div class="step-title">Que horas?</div>
      <div class="loading" id="slotsLoading"><div class="spinner"></div> Buscando horários…</div>
      <div class="slots-grid" id="slotsGrid" style="display:none"></div>
    </div>`

  const date = new Date(state.selectedDate + 'T00:00:00')
  const dow = date.getDay()
  const duration = state.selectedService?.duration_minutes || 30

  const { data: existingBookings } = await db.from('bookings')
    .select('barber_id, start_time, end_time')
    .eq('barbershop_id', state.shop.id)
    .eq('date', state.selectedDate)
    .in('status', ['confirmed', 'blocked'])

  // Dias fechados pelo barbeiro (folga, imprevisto) não oferecem horários
  const { data: dayBlocks } = await db.from('blocked_days')
    .select('barber_id')
    .eq('date', state.selectedDate)
  const blockedBarberIds = new Set((dayBlocks || []).map(b => b.barber_id))

  const relevantBarbers = (state.selectedBarber ? [state.selectedBarber] : state.barbers)
    .filter(b => !blockedBarberIds.has(b.id))
  const allSlots = new Map()

  relevantBarbers.forEach(barber => {
    const avails = state.availability.filter(a => a.barber_id === barber.id && a.day_of_week === dow)
    avails.forEach(avail => {
      const [sh, sm] = avail.start_time.split(':').map(Number)
      const [eh, em] = avail.end_time.split(':').map(Number)
      let cur = sh * 60 + sm
      const end = eh * 60 + em

      while (cur + duration <= end) {
        const slotEnd = cur + duration
        const timeStr = `${String(Math.floor(cur/60)).padStart(2,'0')}:${String(cur%60).padStart(2,'0')}`
        const timeEndStr = `${String(Math.floor(slotEnd/60)).padStart(2,'0')}:${String(slotEnd%60).padStart(2,'0')}`

        const conflict = (existingBookings || []).some(bk =>
          bk.barber_id === barber.id &&
          bk.start_time < timeEndStr &&
          bk.end_time > timeStr
        )

        if (!conflict) {
          if (!allSlots.has(timeStr)) allSlots.set(timeStr, [])
          allSlots.get(timeStr).push(barber.id)
        }
        cur += 30
      }
    })
  })

  document.getElementById('slotsLoading').style.display = 'none'
  const grid = document.getElementById('slotsGrid')
  grid.style.display = 'grid'

  if (!allSlots.size) {
    grid.outerHTML = '<div class="empty">Sem horários disponíveis nessa data.<br>Tente outro dia.</div>'
    return
  }

  const sortedSlots = [...allSlots.keys()].sort()
  sortedSlots.forEach(time => {
    const el = document.createElement('div')
    el.className = 'slot' + (state.selectedTime === time ? ' selected' : '')
    el.textContent = time
    el.onclick = () => {
      state.selectedTime = time
      state.availableBarberIds = allSlots.get(time)
      renderStep(5)
    }
    grid.appendChild(el)
  })
}

// ── STEP 5: Dados do cliente + confirmação ──
function renderClientForm(main) {
  const dateObj = new Date(state.selectedDate + 'T00:00:00')
  const dateFormatted = `${dateObj.getDate()} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][dateObj.getMonth()]}`
  const barberName = state.selectedBarber?.name || 'Primeiro disponível'

  main.innerHTML = `
    <div class="step active">
      ${backBtn(4)}
      <div class="step-label">Passo 5 de 5</div>
      <div class="step-title">Seus dados</div>

      <div class="summary-box">
        <div class="summary-row">
          <span class="summary-label">Serviço</span>
          <span class="summary-value">${state.selectedService?.name}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Barbeiro</span>
          <span class="summary-value">${barberName}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Data</span>
          <span class="summary-value">${dateFormatted}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Horário</span>
          <span class="summary-value">${state.selectedTime}</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Seu nome</label>
        <input class="form-input" id="clientName" type="text" placeholder="João Silva"
          value="${state.clientName}" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label class="form-label">WhatsApp (com DDD)</label>
        <input class="form-input" id="clientPhone" type="tel" placeholder="11 99999-9999"
          value="${state.clientPhone}" autocomplete="tel">
      </div>

      <button class="btn-primary" id="confirmBtn" onclick="confirmBooking()">
        Confirmar agendamento
      </button>
    </div>`
}

// ────────────────────────────────────────────────
// CONFIRMAR
// ────────────────────────────────────────────────
async function confirmBooking() {
  const name = document.getElementById('clientName').value.trim()
  const phone = document.getElementById('clientPhone').value.trim()

  if (!name || !phone) {
    alert('Preencha seu nome e WhatsApp.')
    return
  }
  if (phone.replace(/\D/g,'').length < 10) {
    alert('WhatsApp inválido. Inclua o DDD.')
    return
  }

  state.clientName = name
  state.clientPhone = phone

  const btn = document.getElementById('confirmBtn')
  btn.disabled = true
  btn.textContent = 'Confirmando…'

  let barberId = state.selectedBarber?.id
  if (!barberId && state.availableBarberIds?.length) {
    barberId = state.availableBarberIds[0]
  }

  const duration = state.selectedService.duration_minutes
  const [sh, sm] = state.selectedTime.split(':').map(Number)
  const endMin = sh * 60 + sm + duration
  const endTime = `${String(Math.floor(endMin/60)).padStart(2,'0')}:${String(endMin%60).padStart(2,'0')}`

  const { error } = await db.from('bookings').insert({
    barbershop_id: state.shop.id,
    barber_id: barberId,
    service_id: state.selectedService.id,
    client_name: name,
    client_phone: phone.replace(/\D/g,''),
    date: state.selectedDate,
    start_time: state.selectedTime,
    end_time: endTime,
    status: 'confirmed'
  })

  if (error) {
    btn.disabled = false
    btn.textContent = 'Confirmar agendamento'
    alert('Erro ao confirmar. Tente novamente.')
    return
  }

  renderConfirmation()
}

function renderConfirmation() {
  const dateObj = new Date(state.selectedDate + 'T00:00:00')
  const dateFormatted = `${DIAS_FULL[dateObj.getDay()]}, ${dateObj.getDate()} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][dateObj.getMonth()]}`

  document.getElementById('progressBar').style.display = 'none'
  document.getElementById('main').innerHTML = `
    <div style="padding-top:32px;">
      <div class="confirm-icon">✅</div>
      <div class="confirm-title">Agendado!</div>
      <div class="confirm-sub">
        Seu horário está confirmado.<br>
        Te esperamos na ${state.shop.name}.
      </div>
      <div class="summary-box">
        <div class="summary-row">
          <span class="summary-label">Serviço</span>
          <span class="summary-value">${state.selectedService.name}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Data</span>
          <span class="summary-value">${dateFormatted}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Horário</span>
          <span class="summary-value">${state.selectedTime}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Confirmação para</span>
          <span class="summary-value">${state.clientName}</span>
        </div>
      </div>
      <button class="btn-primary" onclick="location.reload()">Fazer outro agendamento</button>
    </div>`
}

// ────────────────────────────────────────────────
// START
// ────────────────────────────────────────────────
init()
</script>
</body>
