<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Navalha no Bigode</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
<style>
  :root { --primary: #D4A843; --bg: #0F172A; --surface: #1E293B; --border: #334155; --ink: #F8FAFC; --ink-2: #94A3B8; --ink-3: #475569; --green: #22c55e; --red: #ef4444; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }
  .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .nav-brand { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; color: var(--primary); }
  .nav-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .content { padding: 28px 24px; max-width: 960px; margin: 0 auto; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .section-title { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; }
  .btn-add { background: var(--primary); color: #0F172A; border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 10px; }
  .client-actions { flex-basis: 100%; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 12px; }
  .client-avatar { width: 48px; height: 48px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; font-family: 'Sora', sans-serif; color: #0F172A; flex-shrink: 0; }
  .client-body { flex: 1; }
  .client-name { font-weight: 700; font-size: 16px; }
  .client-slug { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .plan-pill { font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 10px; text-transform: capitalize; }
  .plan-solo { background: rgba(148,163,184,0.15); color: var(--ink-2); }
  .plan-equipe { background: rgba(212,168,67,0.15); color: var(--primary); }
  .plan-black { background: rgba(255,255,255,0.08); color: var(--ink); }
  .status-pill { font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 10px; }
  .status-active { background: rgba(34,197,94,0.12); color: var(--green); }
  .status-suspended { background: rgba(239,68,68,0.12); color: var(--red); }
  .status-trial { background: rgba(212,168,67,0.12); color: var(--primary); }
  .client-actions { display: flex; gap: 8px; }
  .action-btn { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--ink-2); transition: all 0.18s; }
  .action-btn:hover { color: var(--ink); border-color: var(--ink-2); }
  .action-btn.suspend { border-color: var(--red); color: var(--red); }
  .action-btn.suspend:hover { background: var(--red); color: #fff; }
  .action-btn.activate { border-color: var(--green); color: var(--green); }
  .action-btn.activate:hover { background: var(--green); color: #fff; }
  .link-btn { font-size: 12px; color: var(--primary); text-decoration: none; border: 1px solid rgba(212,168,67,0.3); border-radius: 8px; padding: 7px 14px; font-weight: 600; }
  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 480px; }
  .modal-title { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 24px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
  .form-input, .form-select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; }
  .form-input:focus, .form-select:focus { border-color: var(--primary); }
  .form-hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-cancel { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--ink-2); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-save { flex: 1; padding: 14px; border-radius: 10px; border: none; background: var(--primary); color: #0F172A; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--ink-3); font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px; color: var(--ink-3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-tab { padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--border); background: none; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .filter-tab.active { background: var(--primary); border-color: var(--primary); color: #0F172A; }
  .filter-tab:hover:not(.active) { border-color: var(--ink-2); color: var(--ink); }
</style>
</head>
<body>

<div id="loginGate" style="display:none; min-height:100dvh; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px; width:100%; max-width:400px;">
    <div class="nav-brand" style="margin-bottom:4px;">💈 Navalha no Bigode</div>
    <div class="nav-sub" style="margin-bottom:24px;">Painel Administrativo — acesso restrito</div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" id="admEmail" type="email" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" id="admPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
    </div>
    <div id="admErr" style="display:none; color:var(--red); font-size:13px; margin-bottom:10px;"></div>
    <button class="btn-add" style="width:100%;" onclick="adminLogin()">Entrar</button>
  </div>
</div>

<div id="adminApp" style="display:none;">
<nav class="nav">
  <div>
    <div class="nav-brand">💈 Navalha no Bigode</div>
    <div class="nav-sub">Painel Administrativo</div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn-add" onclick="openConvite()">📣 Convidar</button>
    <button class="action-btn" onclick="openMyPass()">🔑 Trocar senha</button>
    <button class="action-btn" onclick="adminLogout()">Sair</button>
  </div>
</nav>

<main class="content">
  <div class="section-header">
    <div class="section-title">Clientes</div>
    <button class="btn-add" onclick="openNewModal()">+ Novo cliente</button>
  </div>
  <div class="filter-tabs">
    <button class="filter-tab active" id="tab-all"       onclick="setFilter('all')">Todos</button>
    <button class="filter-tab"        id="tab-active"    onclick="setFilter('active')">Ativos</button>
    <button class="filter-tab"        id="tab-suspended" onclick="setFilter('suspended')">Inativos</button>
  </div>
  <div id="clientList"><div class="loading"><div class="spinner"></div> Carregando…</div></div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
const ADMIN_EMAIL = 'welsoaress@gmail.com'
let clients = []
let activeFilter = 'all'

function setFilter(f) {
  activeFilter = f
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'))
  const tab = document.getElementById('tab-' + f)
  if (tab) tab.classList.add('active')
  renderClients()
}

async function initAdmin() {
  const { data: { session } } = await db.auth.getSession()
  if (session && session.user.email === ADMIN_EMAIL) {
    document.getElementById('loginGate').style.display = 'none'
    document.getElementById('adminApp').style.display = 'block'
    loadClients()
  } else {
    if (session) await db.auth.signOut()
    document.getElementById('adminApp').style.display = 'none'
    document.getElementById('loginGate').style.display = 'flex'
  }
}

async function adminLogin() {
  const email = document.getElementById('admEmail').value.trim()
  const pass  = document.getElementById('admPass').value
  const errEl = document.getElementById('admErr')
  errEl.style.display = 'none'
  if (email.toLowerCase() !== ADMIN_EMAIL) {
    errEl.textContent = 'Este e-mail não tem acesso ao painel administrativo.'
    errEl.style.display = 'block'; return
  }
  const { error } = await db.auth.signInWithPassword({ email, password: pass })
  if (error) {
    errEl.textContent = 'Erro: ' + (error.message || 'desconhecido') + (error.status ? ' (código ' + error.status + ')' : '')
    errEl.style.display = 'block'; return
  }
  initAdmin()
}

// Troca da senha do próprio admin
function openMyPass() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'myPassModal'
  overlay.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <div class="modal-title">🔑 Trocar minha senha</div>
      <div class="form-group">
        <label class="form-label">Nova senha</label>
        <div style="position:relative;">
          <input class="form-input" id="mpPass1" type="password" placeholder="Mínimo 8 caracteres" style="padding-right:44px;">
          <button type="button" onclick="mpToggle()" id="mpEye" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-2);font-size:18px;padding:4px;">👁</button>
        </div>
        <div class="form-hint">Use letras, números e símbolos — essa senha controla todos os seus clientes.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Repita a nova senha</label>
        <input class="form-input" id="mpPass2" type="password" placeholder="••••••••">
      </div>
      <div id="mpErr" style="display:none;color:var(--red);font-size:13px;margin-bottom:10px;"></div>
      <div class="modal-actions">
        <button class="action-btn" style="flex:1;" onclick="document.getElementById('myPassModal').remove()">Cancelar</button>
        <button class="btn-add" style="flex:1;" id="mpSave" onclick="saveMyPass()">Salvar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

function mpToggle() {
  const inp = document.getElementById('mpPass1')
  const btn = document.getElementById('mpEye')
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈' }
  else { inp.type = 'password'; btn.textContent = '👁' }
}

async function saveMyPass() {
  const p1 = document.getElementById('mpPass1').value
  const p2 = document.getElementById('mpPass2').value
  const errEl = document.getElementById('mpErr')
  errEl.style.display = 'none'
  if (p1.length < 8) { errEl.textContent = 'A senha deve ter pelo menos 8 caracteres.'; errEl.style.display = 'block'; return }
  if (p1 !== p2) { errEl.textContent = 'As senhas não são iguais.'; errEl.style.display = 'block'; return }
  const btn = document.getElementById('mpSave')
  btn.disabled = true; btn.textContent = 'Salvando…'
  const { error } = await db.auth.updateUser({ password: p1 })
  if (error) {
    btn.disabled = false; btn.textContent = 'Salvar'
    errEl.textContent = 'Erro: ' + error.message
    errEl.style.display = 'block'; return
  }
  document.getElementById('myPassModal').remove()
  alert('✅ Senha alterada! Use a nova no próximo login.')
}

async function adminLogout() {
  await db.auth.signOut()
  initAdmin()
}

// ── Convidar barbeiro em 2 tempos: 1º contato curto (demo) e, quando ele topar, o teste (link único) ──
// Atenção: nestas mensagens (que abrem via wa.me) use só emojis simples (✂️ ✅ ⏰) —
// os "modernos" (💈 👉 🤝 🤜🤛) viram � no compose do WhatsApp em alguns Androids.
function conviteTexto(nome) {
  return `Fala${nome ? ', ' + nome : ''}! ✂️\n\n` +
    `Lancei um app de agendamento feito só pra barbearia — e lembrei de você.\n\n` +
    `Teu cliente marca o horário sozinho pelo link. Um robô no WhatsApp cuida do resto: confirma, manda lembrete e preenche horário vago quando alguém desmarca.\n\n` +
    `Vê funcionando — agenda um teste com o TEU WhatsApp e o robô te responde na hora:\n` +
    `https://demo.navalhanobigode.com.br\n\n` +
    `Se curtir, te libero *1 mês grátis* na tua barbearia. É só me responder aqui!`
}

function testeTexto(nome, trialUrl) {
  return `Boa${nome ? ', ' + nome : ''}! Fechado então. ✅\n\n` +
    `Teu convite pessoal — *1 mês grátis*, sem pagar nada agora:\n` +
    `${trialUrl}\n\n` +
    `Leva uns 10 minutos: escolhe o plano, cadastra serviços e horários, e já sai com o teu link pronto pra mandar pros clientes.\n\n` +
    `Se depois quiser ficar, é R$ 39,90/barbeiro/mês. Não curtiu? É só deixar pra lá. Abraço! ✂️`
}

function openConvite() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'conviteModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">📣 Convidar barbeiro</div>
      <div class="form-group">
        <label class="form-label">Nome do barbeiro (opcional)</label>
        <input class="form-input" id="cvNome" type="text" placeholder="Ex.: Marcão">
      </div>
      <div class="form-group">
        <label class="form-label">WhatsApp dele (com DDD)</label>
        <input class="form-input" id="cvZap" type="tel" placeholder="Ex.: 11 91234-5678" inputmode="tel">
        <div class="form-hint"><strong>1º contato</strong>: mensagem curta com a demo. <strong>Liberar teste</strong>: quando ele topar — gera o link único de 10 dias.</div>
      </div>
      <div id="cvErr" style="display:none;color:var(--red);font-size:13px;margin-bottom:10px;"></div>
      <div class="modal-actions">
        <button class="action-btn" style="flex:1;" onclick="document.getElementById('conviteModal').remove()">Cancelar</button>
        <button class="action-btn" style="flex:1;" id="cvSendConvite" onclick="enviarConvite('convite')">📣 1º contato</button>
        <button class="btn-add" style="flex:1;" id="cvSendTeste" onclick="enviarConvite('teste')">🎁 Liberar teste</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
  document.getElementById('cvZap').focus()
}

async function enviarConvite(tipo) {
  const nome = document.getElementById('cvNome').value.trim()
  let zap = document.getElementById('cvZap').value.replace(/\D/g, '')
  const errEl = document.getElementById('cvErr')
  errEl.style.display = 'none'
  if (zap.length === 10 || zap.length === 11) zap = '55' + zap
  if (zap.length < 12 || zap.length > 13) {
    errEl.textContent = 'Número inválido. Use DDD + número (10 ou 11 dígitos).'
    errEl.style.display = 'block'; return
  }
  const btn = document.getElementById(tipo === 'teste' ? 'cvSendTeste' : 'cvSendConvite')
  const rotulo = btn.textContent

  let texto
  if (tipo === 'teste') {
    // Só aqui o convite de uso único é gerado — nada de código desperdiçado no 1º contato
    btn.disabled = true; btn.textContent = 'Gerando…'
    try {
      const { data: { session } } = await db.auth.getSession()
      const r = await fetch('/api/trial-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session?.access_token || '') },
        body: JSON.stringify({ label: nome || zap })
      })
      const d = await r.json()
      if (!r.ok || !d.ok) throw new Error(d.error || 'não gerou')
      texto = testeTexto(nome, d.url)
    } catch (e) {
      btn.disabled = false; btn.textContent = rotulo
      errEl.textContent = 'Erro ao gerar o convite: ' + e.message + ' — tenta de novo.'
      errEl.style.display = 'block'; return
    }
  } else {
    texto = conviteTexto(nome)
  }

  const waUrl = 'https://wa.me/' + zap + '?text=' + encodeURIComponent(texto)
  const w = window.open(waUrl, '_blank')
  if (w) { document.getElementById('conviteModal').remove(); return }
  // Popup bloqueado: vira um link pra tocar
  btn.disabled = false
  btn.outerHTML = `<a class="btn-add" style="flex:1;text-align:center;text-decoration:none;" href="${waUrl}" target="_blank" onclick="document.getElementById('conviteModal').remove()">📱 Abrir WhatsApp</a>`
}

const PLAN_CONFIG = {
  solo:   { max_barbers: 1, changes_limit: 10 },
  equipe: { max_barbers: 3, changes_limit: 30 },
  black:  { max_barbers: 5, changes_limit: null }
}

async function resetPass(id) {
  const c = clients.find(x => x.id === id)
  if (!c || !c.owner_email) { alert('Este cliente não tem e-mail cadastrado.'); return }
  if (!confirm(`Enviar link de redefinição de senha para ${c.owner_email}?`)) return
  const btn = document.getElementById('reset-' + id)
  btn.disabled = true; btn.textContent = 'Enviando…'
  const { error } = await db.auth.resetPasswordForEmail(c.owner_email, {
    redirectTo: window.location.origin + '/painel/nova-senha.html'
  })
  btn.disabled = false
  if (error) {
    btn.textContent = '🔑 Reset senha'
    alert('Erro ao enviar: ' + error.message)
    return
  }
  btn.textContent = '✅ Enviado'
  setTimeout(() => { btn.textContent = '🔑 Reset senha' }, 3000)
}

function openSetPass(id) {
  const c = clients.find(x => x.id === id)
  if (!c || !c.owner_email) { alert('Este cliente não tem e-mail cadastrado.'); return }
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'setPassModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">🔒 Definir senha — ${c.name}</div>
      <div class="form-group">
        <label class="form-label">Nova senha para ${c.owner_email}</label>
        <div style="position:relative;">
          <input class="form-input" id="spPass" type="text" placeholder="Mínimo 6 caracteres" style="padding-right:44px;">
          <button type="button" onclick="spToggle()" id="spEye" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-2);font-size:18px;padding:4px;">🙈</button>
        </div>
        <div class="form-hint">A senha aparece visível para você conferir antes de salvar.</div>
      </div>
      <div id="spErr" style="display:none;color:var(--red);font-size:13px;margin-bottom:10px;"></div>
      <div class="modal-actions">
        <button class="action-btn" style="flex:1;" onclick="document.getElementById('setPassModal').remove()">Cancelar</button>
        <button class="btn-add" style="flex:1;" id="spSave" onclick="saveSetPass('${c.id}')">Salvar senha</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
  document.getElementById('spPass').focus()
}

function spToggle() {
  const inp = document.getElementById('spPass')
  const btn = document.getElementById('spEye')
  if (inp.type === 'text') { inp.type = 'password'; btn.textContent = '👁' }
  else { inp.type = 'text'; btn.textContent = '🙈' }
}

async function saveSetPass(id) {
  const c = clients.find(x => x.id === id)
  const pass = document.getElementById('spPass').value
  const errEl = document.getElementById('spErr')
  errEl.style.display = 'none'
  if (pass.length < 6) { errEl.textContent = 'A senha deve ter pelo menos 6 caracteres.'; errEl.style.display = 'block'; return }
  const btn = document.getElementById('spSave')
  btn.disabled = true; btn.textContent = 'Salvando…'
  const { error } = await db.rpc('admin_set_password', { user_email: c.owner_email, new_password: pass })
  if (error) {
    btn.disabled = false; btn.textContent = 'Salvar senha'
    errEl.textContent = 'Erro: ' + error.message
    errEl.style.display = 'block'; return
  }
  document.getElementById('setPassModal').remove()
  alert(`✅ Senha de ${c.owner_email} alterada para: ${pass}\n\nInforme ao barbeiro por telefone ou WhatsApp.`)
}

let shopStats = {}
async function loadClients() {
  const { data } = await db.from('barbershops').select('*').order('created_at', { ascending: false })
  clients = data || []
  renderClients()
  loadShopStats() // agendamentos por barbearia (não bloqueia a lista)
}

async function loadShopStats() {
  try {
    const { data: { session } } = await db.auth.getSession()
    const r = await fetch('/api/admin-stats', { headers: { 'Authorization': 'Bearer ' + (session?.access_token || '') } })
    const d = await r.json()
    if (d.stats) { shopStats = d.stats; renderClients() }
  } catch (e) {}
}

// Linha de saúde do cliente: mede se ele está usando, evoluindo ou precisando de ajuda
function statsLine(c) {
  const s = shopStats[c.id]
  if (!s) return ''
  const idadeDias = Math.floor((Date.now() - Date.parse(c.created_at)) / 86400000)
  if (s.total === 0) {
    const alerta = idadeDias >= 2
    return `<div class="client-slug" style="margin-top:2px;${alerta ? 'color:#fbbf24;font-weight:700;' : ''}">📊 Nenhum agendamento ainda${alerta ? ' — dá um alô pra ajudar!' : ''}</div>`
  }
  return `<div class="client-slug" style="margin-top:2px;">📊 <strong>${s.total}</strong> agendamento${s.total > 1 ? 's' : ''} · ${s.semana} nos últimos 7 dias · ${s.futuros} futuro${s.futuros === 1 ? '' : 's'}${s.semana > 0 ? ' <span style="color:#4ade80;">▲</span>' : ''}</div>`
}

function renderClients() {
  const el = document.getElementById('clientList')

  // Atualiza contadores nas abas
  const total      = clients.length
  const totalAtivo = clients.filter(c => c.status === 'active').length
  const totalInativo = clients.filter(c => c.status === 'suspended').length
  const tabAll  = document.getElementById('tab-all')
  const tabAct  = document.getElementById('tab-active')
  const tabSusp = document.getElementById('tab-suspended')
  if (tabAll)  tabAll.textContent  = `Todos (${total})`
  if (tabAct)  tabAct.textContent  = `Ativos (${totalAtivo})`
  if (tabSusp) tabSusp.textContent = `Inativos (${totalInativo})`

  // Filtra conforme aba selecionada
  let filtered = clients
  if (activeFilter === 'active')    filtered = clients.filter(c => c.status === 'active')
  if (activeFilter === 'suspended') filtered = clients.filter(c => c.status === 'suspended')

  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🏪</div><p>Nenhum cliente nesta categoria.</p></div>'
    return
  }
  const hoje = new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10)
  const fmtD = d => d.slice(8, 10) + '/' + d.slice(5, 7)
  // Em teste = ativo que nunca pagou nada (nem kit, nem mensalidade). Demo fica de fora.
  const emTeste = c => c.status === 'active' && !c.kit_paid && !c.last_renewal_payment_id && c.slug !== 'demo' && c.next_due
  const diasTeste = c => Math.max(0, Math.round((Date.parse(c.next_due) - Date.parse(hoje)) / 86400000))
  el.innerHTML = filtered.map(c => `
    <div class="client-card" ${emTeste(c) ? 'style="border-left:4px solid var(--primary);"' : ''}>
      <div class="client-avatar">${c.name.charAt(0)}</div>
      <div class="client-body">
        <div class="client-name">${c.name}</div>
        <div class="client-slug">🔗 ${c.slug}.navalhanobigode.com.br</div>
        ${c.next_due ? `<div class="client-slug" style="margin-top:2px;">${c.next_due < hoje ? `<span style="color:#f87171;font-weight:700;">🔴 Venceu dia ${fmtD(c.next_due)}</span>` : (emTeste(c) ? `⏳ Teste termina dia ${fmtD(c.next_due)}` : `📅 Vence dia ${fmtD(c.next_due)}`)}</div>` : ''}
        ${statsLine(c)}
      </div>
      ${emTeste(c) ? `<span class="plan-pill" style="background:rgba(212,168,67,0.15);border:1px solid rgba(212,168,67,0.45);color:var(--primary);font-weight:800;">🎁 TESTE · ${diasTeste(c) === 0 ? 'último dia!' : 'faltam ' + diasTeste(c) + ' dia' + (diasTeste(c) > 1 ? 's' : '')}</span>` : ''}
      <span class="plan-pill plan-${c.plan}">${c.plan}</span>
      <span class="status-pill status-${c.status}">${statusLabel(c.status)}</span>
      <div class="client-actions">
        <button class="action-btn" onclick="verAgendamentos('${c.id}')">📊 Agendamentos</button>
        <a class="link-btn" href="/?barbearia=${c.slug}" target="_blank">Ver página ↗</a>
        <a class="link-btn" href="/admin/cartao.html?slug=${c.slug}" target="_blank">💳 Cartão</a>
        ${c.status === 'active'
          ? `<button class="action-btn suspend" onclick="toggleStatus('${c.id}','suspended')">Suspender</button>`
          : `<button class="action-btn activate" onclick="toggleStatus('${c.id}','active')">Reativar</button>`
        }
        <button class="action-btn" onclick="openTrocaEmail('${c.id}')">✉️ Trocar e-mail</button>
        <button class="action-btn" id="reset-${c.id}" onclick="resetPass('${c.id}')">🔑 Reset senha</button>
        <button class="action-btn" onclick="openSetPass('${c.id}')">🔒 Definir senha</button>
      </div>
    </div>`).join('')
}

// ── Trocar e-mail do cliente (digitou errado no cadastro): corrige login + cadastro ──
function openTrocaEmail(id) {
  const c = clients.find(x => x.id === id)
  if (!c) return
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'emailModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">✉️ Trocar e-mail — ${c.name}</div>
      <div class="form-group">
        <label class="form-label">E-mail atual (errado)</label>
        <input class="form-input" value="${c.owner_email || '—'}" disabled style="opacity:0.6;">
      </div>
      <div class="form-group">
        <label class="form-label">E-mail correto</label>
        <input class="form-input" id="teNovo" type="email" placeholder="email@certo.com" autocomplete="off">
        <div class="form-hint">Troca o login e o cadastro de uma vez. A senha continua a mesma.</div>
      </div>
      <div id="teErr" style="display:none;color:var(--red);font-size:13px;margin-bottom:10px;"></div>
      <div class="modal-actions">
        <button class="action-btn" style="flex:1;" onclick="document.getElementById('emailModal').remove()">Cancelar</button>
        <button class="btn-add" style="flex:1;" id="teSave" onclick="salvarTrocaEmail('${c.id}')">Salvar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
  document.getElementById('teNovo').focus()
}

async function salvarTrocaEmail(id) {
  const novo = document.getElementById('teNovo').value.trim().toLowerCase()
  const errEl = document.getElementById('teErr')
  errEl.style.display = 'none'
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(novo)) {
    errEl.textContent = 'Digite um e-mail válido.'
    errEl.style.display = 'block'; return
  }
  const btn = document.getElementById('teSave')
  btn.disabled = true; btn.textContent = 'Salvando…'
  try {
    const { data: { session } } = await db.auth.getSession()
    const r = await fetch('/api/admin-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session?.access_token || '') },
      body: JSON.stringify({ barbershop_id: id, new_email: novo })
    })
    const d = await r.json()
    if (!r.ok || !d.ok) throw new Error(d.error || 'falhou')
    // Reenvia o e-mail de boas-vindas pro endereço corrigido (como se tivesse acabado de se cadastrar)
    fetch('/api/welcome', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ barbershop_id: id }) }).catch(() => {})
    document.getElementById('emailModal').remove()
    alert(d.auth_updated
      ? `✅ E-mail trocado!\n\nNovo login: ${novo}\nSenha: a mesma que a pessoa criou.\n\n📧 O e-mail de boas-vindas foi reenviado pro endereço novo. Avisa o barbeiro no WhatsApp.`
      : `✅ Cadastro atualizado para ${novo} (boas-vindas reenviado).\n\n⚠️ Não achei a conta de login com o e-mail antigo — se o barbeiro não conseguir entrar, use "Definir senha" ou me chama.`)
    loadClients()
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Salvar'
    errEl.textContent = 'Erro: ' + e.message + ' — tenta de novo.'
    errEl.style.display = 'block'
  }
}

// ── Detalhe dos agendamentos de um cliente ──
async function verAgendamentos(id) {
  const c = clients.find(x => x.id === id)
  if (!c) return
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'bkModal'
  overlay.innerHTML = `
    <div class="modal" style="max-width:520px;width:94%;">
      <div class="modal-title">📊 Agendamentos — ${c.name}</div>
      <div id="bkModalBody" style="max-height:60vh;overflow-y:auto;font-size:13.5px;">
        <div style="color:var(--ink-2);padding:14px 0;">Carregando…</div>
      </div>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="action-btn" style="flex:1;" onclick="document.getElementById('bkModal').remove()">Fechar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)

  const bodyEl = document.getElementById('bkModalBody')
  try {
    const { data: { session } } = await db.auth.getSession()
    const r = await fetch('/api/admin-bookings?shop=' + id, { headers: { 'Authorization': 'Bearer ' + (session?.access_token || '') } })
    const d = await r.json()
    const bks = d.bookings || []
    if (!bks.length) {
      bodyEl.innerHTML = '<div style="color:var(--ink-2);padding:14px 0;">Nenhum agendamento ainda. Esse cliente pode estar precisando de uma força pra divulgar o link. 📣</div>'
      return
    }
    const hoje = new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10)
    const fmtD = dt => dt.slice(8, 10) + '/' + dt.slice(5, 7)
    const stCor = { confirmed: '#4ade80', completed: '#94A3B8', cancelled: '#f87171', no_show: '#fbbf24' }
    const stTxt = { confirmed: 'Confirmado', completed: 'Concluído', cancelled: 'Cancelado', no_show: 'Faltou' }
    const linha = b => `
      <div style="display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);">
        <div style="font-weight:700;white-space:nowrap;">${fmtD(b.date)} ${String(b.start_time).slice(0, 5)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${b.client_name}</div>
          <div style="color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">✂️ ${b.services?.name || '—'}${b.barbers?.name ? ' · 💇 ' + b.barbers.name : ''}</div>
        </div>
        <div style="font-size:11.5px;font-weight:700;color:${stCor[b.status] || 'var(--ink-2)'};white-space:nowrap;">${stTxt[b.status] || b.status}</div>
      </div>`
    const futuros = bks.filter(b => b.date >= hoje).sort((a, z) => (a.date + a.start_time).localeCompare(z.date + z.start_time))
    const passados = bks.filter(b => b.date < hoje)
    bodyEl.innerHTML =
      (futuros.length ? `<div style="font-weight:800;color:var(--primary);margin:4px 0 2px;">Próximos (${futuros.length})</div>` + futuros.map(linha).join('') : '') +
      (passados.length ? `<div style="font-weight:800;color:var(--ink-2);margin:14px 0 2px;">Anteriores (${passados.length})</div>` + passados.map(linha).join('') : '')
  } catch (e) {
    bodyEl.innerHTML = '<div style="color:#f87171;padding:14px 0;">Erro ao carregar. Tenta de novo.</div>'
  }
}

function statusLabel(s) {
  return { active: 'Ativo', suspended: 'Suspenso', trial: 'Trial' }[s] || s
}

async function toggleStatus(id, status) {
  const label = status === 'suspended' ? 'Suspender' : 'Reativar'
  if (!confirm(`${label} este cliente?`)) return
  await db.from('barbershops').update({ status }).eq('id', id)
  loadClients()
}

function openNewModal() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'newModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Novo Cliente</div>
      <div class="form-group">
        <label class="form-label">Nome da barbearia</label>
        <input class="form-input" id="nName" type="text" placeholder="Barbearia do João">
      </div>
      <div class="form-group">
        <label class="form-label">Slug (URL)</label>
        <input class="form-input" id="nSlug" type="text" placeholder="joao" oninput="autoSlug(this)">
        <div class="form-hint">Ficará: <strong id="slugPreview">joao</strong>.navalhanobigode.com.br</div>
      </div>
      <div class="form-group">
        <label class="form-label">E-mail do dono</label>
        <input class="form-input" id="nEmail" type="email" placeholder="joao@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Plano</label>
        <select class="form-select" id="nPlan" onchange="updatePlanInfo()">
          <option value="solo">Solo — R$ 39,90/mês (1 barbeiro)</option>
          <option value="equipe" selected>Equipe — R$ 119,70/mês (3 barbeiros)</option>
          <option value="black">Black — R$ 199,50/mês (5 barbeiros)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Cor principal (hex)</label>
        <input class="form-input" id="nColor" type="text" value="#D4A843" placeholder="#D4A843">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveClient()">Criar cliente</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

function autoSlug(input) {
  const slug = input.value.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
  document.getElementById('slugPreview').textContent = slug || 'slug'
}

async function saveClient() {
  const name = document.getElementById('nName').value.trim()
  const slug = document.getElementById('nSlug').value.toLowerCase().replace(/[^a-z0-9-]/g,'').trim()
  const email = document.getElementById('nEmail').value.trim()
  const plan = document.getElementById('nPlan').value
  const color = document.getElementById('nColor').value.trim() || '#D4A843'

  if (!name || !slug) { alert('Nome e slug são obrigatórios.'); return }

  const cfg = PLAN_CONFIG[plan]
  const { error } = await db.from('barbershops').insert({
    name, slug, owner_email: email, plan,
    primary_color: color,
    status: 'active',
    max_barbers: cfg.max_barbers,
    changes_limit: cfg.changes_limit
  })

  if (error) { alert('Erro: ' + (error.message || 'slug já existe?')); return }
  closeModal()
  loadClients()
}

function closeModal() { document.getElementById('newModal')?.remove() }

initAdmin()
</script>
</body>
