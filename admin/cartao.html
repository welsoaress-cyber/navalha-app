<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão — Navalha no Bigode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap">
<style>
  :root { --primary: #D4A843; --bg: #0F172A; --surface: #1E293B; --border: #334155; --ink: #F8FAFC; --ink-2: #94A3B8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; padding: 28px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: 'Sora', sans-serif; font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 24px; }
  .card-preview { width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: block; }
  .row { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .btn { background: var(--primary); color: #0F172A; border: none; border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: none; border: 1.5px solid var(--border); color: var(--ink-2); }
  .hint { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .loading { text-align: center; padding: 60px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 Cartão da barbearia</h1>
  <p class="sub" id="subTitle">Carregando…</p>
  <div id="content" class="loading">Gerando arte…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/cartao.js"></script>
<script>
// Cartão padrão gráfica: 9x5cm + 2mm de sangria por lado = 94x54mm @ 300dpi
const W = 1110, H = 638

async function init() {
  const params = new URLSearchParams(window.location.search)
  const slug = params.get('slug')
  if (!slug) { document.getElementById('content').textContent = 'Falta o parâmetro ?slug='; return }

  const { data: shop } = await db.from('barbershops').select('*').eq('slug', slug).maybeSingle()
  if (!shop) { document.getElementById('content').textContent = 'Barbearia não encontrada.'; return }

  document.getElementById('subTitle').textContent = `${shop.name} — 9×5cm com sangria, 300dpi, pronto para gráfica`
  await loadCardFonts()

  const cor  = shop.primary_color || '#D4A843'
  const url  = `${shop.slug}.navalhanobigode.com.br`
  const link = `https://${url}`

  const frente = document.createElement('canvas')
  drawCardFront(frente, shop.name, cor)
  const verso = document.createElement('canvas')
  drawCardBack(verso, cor, link)

  const content = document.getElementById('content')
  content.className = ''
  content.innerHTML = ''
  ;[['Frente', frente], ['Verso', verso]].forEach(([label, canvas]) => {
    canvas.className = 'card-preview'
    content.appendChild(canvas)
    const row = document.createElement('div')
    row.className = 'row'
    const b = document.createElement('button')
    b.className = 'btn'
    b.textContent = `⬇️ Baixar ${label} (PNG 300dpi)`
    b.onclick = () => {
      const a = document.createElement('a')
      a.download = `cartao-${shop.slug}-${label.toLowerCase()}.png`
      a.href = canvas.toDataURL('image/png')
      a.click()
    }
    row.appendChild(b)
    content.appendChild(row)
  })

  const hint = document.createElement('div')
  hint.className = 'hint'
  hint.innerHTML = `🖨 <strong>Como imprimir:</strong> envie os dois arquivos para uma gráfica online (Printi, Loja do Cartão, gráfica local) no formato <strong>9×5cm, 4/4 cores, couché 300g</strong>. A arte já inclui 2mm de sangria em cada lado.`
  content.appendChild(hint)
}

init()
</script>
</body>
</html>
