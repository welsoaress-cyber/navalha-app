<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão — Navalha no Bigode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@700;800&display=swap">
<style>
  :root { --primary: #D4A843; --bg: #0F172A; --surface: #1E293B; --border: #334155; --ink: #F8FAFC; --ink-2: #94A3B8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; padding: 28px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: 'Sora', sans-serif; font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 24px; }
  .card-preview { width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: block; }
  .row { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .btn { background: var(--primary); color: #0F172A; border: none; border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: none; border: 1.5px solid var(--border); color: var(--ink-2); }
  .hint { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .loading { text-align: center; padding: 60px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 Cartão da barbearia</h1>
  <p class="sub" id="subTitle">Carregando…</p>
  <div id="content" class="loading">Gerando arte…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="/js/config.js"></script>
<script>
// Cartão padrão gráfica: 9x5cm + 2mm de sangria por lado = 94x54mm @ 300dpi
const W = 1110, H = 638

async function init() {
  const params = new URLSearchParams(window.location.search)
  const slug = params.get('slug')
  if (!slug) { document.getElementById('content').textContent = 'Falta o parâmetro ?slug='; return }

  const { data: shop } = await db.from('barbershops').select('*').eq('slug', slug).maybeSingle()
  if (!shop) { document.getElementById('content').textContent = 'Barbearia não encontrada.'; return }

  document.getElementById('subTitle').textContent = `${shop.name} — 9×5cm com sangria, 300dpi, pronto para gráfica`
  await document.fonts.load('800 80px Sora')
  await document.fonts.load('700 40px Sora')
  await document.fonts.load('600 34px Inter')

  const cor  = shop.primary_color || '#D4A843'
  const url  = `${shop.slug}.navalhanobigode.com.br`
  const link = `https://${url}`

  const frente = drawFront(shop.name, cor, url)
  const verso  = drawBack(shop.name, cor, url, link)

  const content = document.getElementById('content')
  content.className = ''
  content.innerHTML = ''
  ;[['Frente', frente], ['Verso', verso]].forEach(([label, canvas]) => {
    canvas.className = 'card-preview'
    content.appendChild(canvas)
    const row = document.createElement('div')
    row.className = 'row'
    const b = document.createElement('button')
    b.className = 'btn'
    b.textContent = `⬇️ Baixar ${label} (PNG 300dpi)`
    b.onclick = () => {
      const a = document.createElement('a')
      a.download = `cartao-${shop.slug}-${label.toLowerCase()}.png`
      a.href = canvas.toDataURL('image/png')
      a.click()
    }
    row.appendChild(b)
    content.appendChild(row)
  })

  const hint = document.createElement('div')
  hint.className = 'hint'
  hint.innerHTML = `🖨 <strong>Como imprimir:</strong> envie os dois arquivos para uma gráfica online (Printi, Loja do Cartão, gráfica local) no formato <strong>9×5cm, 4/4 cores, couché 300g</strong>. A arte já inclui 2mm de sangria em cada lado.`
  content.appendChild(hint)
}

function baseCanvas() {
  const c = document.createElement('canvas')
  c.width = W; c.height = H
  return [c, c.getContext('2d')]
}

function drawFront(name, cor, url) {
  const [c, x] = baseCanvas()
  x.fillStyle = '#0F172A'; x.fillRect(0, 0, W, H)

  // faixa lateral na cor da barbearia
  x.fillStyle = cor; x.fillRect(0, 0, 26, H)

  // listras de poste de barbeiro no canto
  x.save()
  x.translate(W - 150, 0); x.rotate(0.5)
  for (let i = -6; i < 14; i++) {
    x.fillStyle = i % 2 ? 'rgba(212,168,67,0.10)' : 'rgba(255,255,255,0.04)'
    x.fillRect(i * 44, -200, 22, 1200)
  }
  x.restore()

  // nome
  x.fillStyle = '#F8FAFC'
  x.font = '800 84px Sora'
  x.textAlign = 'center'
  wrapText(x, name, W / 2, H / 2 - 40, W - 220, 92)

  // linha decorativa
  x.strokeStyle = cor; x.lineWidth = 4
  x.beginPath(); x.moveTo(W / 2 - 90, H / 2 + 40); x.lineTo(W / 2 + 90, H / 2 + 40); x.stroke()

  // subtítulo
  x.fillStyle = cor
  x.font = '700 40px Sora'
  x.fillText('Agende seu horário', W / 2, H / 2 + 118)

  // url
  x.fillStyle = '#94A3B8'
  x.font = '600 32px Inter'
  x.fillText(url, W / 2, H - 78)
  return c
}

function drawBack(name, cor, url, link) {
  const [c, x] = baseCanvas()
  x.fillStyle = '#0F172A'; x.fillRect(0, 0, W, H)
  x.fillStyle = cor; x.fillRect(W - 26, 0, 26, H)

  // QR Code
  const qr = qrcode(0, 'M')
  qr.addData(link)
  qr.make()
  const n = qr.getModuleCount()
  const qsize = 400, cell = qsize / n
  const qx = 110, qy = (H - qsize) / 2

  // fundo branco arredondado do QR
  roundRect(x, qx - 26, qy - 26, qsize + 52, qsize + 52, 24, '#FFFFFF')
  x.fillStyle = '#0F172A'
  for (let r = 0; r < n; r++)
    for (let col = 0; col < n; col++)
      if (qr.isDark(r, col)) x.fillRect(qx + col * cell, qy + r * cell, Math.ceil(cell), Math.ceil(cell))

  // textos à direita
  const tx = qx + qsize + 110
  x.textAlign = 'left'
  x.fillStyle = '#F8FAFC'
  x.font = '800 56px Sora'
  wrapText(x, 'Aponte a câmera e agende', tx, H / 2 - 90, W - tx - 90, 64)
  x.fillStyle = '#94A3B8'
  x.font = '600 30px Inter'
  x.fillText('Escolha o serviço, o dia e o horário.', tx, H / 2 + 46)
  x.fillText('Rápido, sem ligação e sem espera.', tx, H / 2 + 92)
  x.fillStyle = cor
  let fs = 32
  x.font = `700 ${fs}px Inter`
  while (fs > 18 && x.measureText(url).width > W - tx - 60) { fs -= 2; x.font = `700 ${fs}px Inter` }
  x.fillText(url, tx, H / 2 + 168)
  return c
}

function roundRect(x, px, py, w, h, r, fill) {
  x.beginPath()
  x.moveTo(px + r, py)
  x.arcTo(px + w, py, px + w, py + h, r)
  x.arcTo(px + w, py + h, px, py + h, r)
  x.arcTo(px, py + h, px, py, r)
  x.arcTo(px, py, px + w, py, r)
  x.closePath()
  x.fillStyle = fill
  x.fill()
}

function wrapText(x, text, cx, cy, maxW, lineH) {
  const words = text.split(' ')
  const lines = []
  let line = ''
  words.forEach(w => {
    const t = line ? line + ' ' + w : w
    if (x.measureText(t).width > maxW && line) { lines.push(line); line = w }
    else line = t
  })
  lines.push(line)
  const startY = cy - ((lines.length - 1) * lineH) / 2
  lines.forEach((l, i) => x.fillText(l, cx, startY + i * lineH))
}

init()
</script>
</body>
</html>
