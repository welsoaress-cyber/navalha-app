<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Navalha no Bigode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
<style>
  :root { --primary: #D4A843; --bg: #0F172A; --surface: #1E293B; --border: #334155; --ink: #F8FAFC; --ink-2: #94A3B8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 400px; }
  .logo { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
  .subtitle { color: var(--ink-2); font-size: 14px; margin-bottom: 32px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; transition: border-color 0.18s; }
  .form-input:focus { border-color: var(--primary); }
  .btn { width: 100%; padding: 15px; border-radius: 10px; background: var(--primary); color: #0F172A; font-size: 15px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; transition: all 0.2s; margin-top: 8px; }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .err { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">💈 Navalha no Bigode</div>
  <div class="subtitle">Acesse o painel da sua barbearia</div>
  <div class="form-group">
    <label class="form-label">E-mail</label>
    <input class="form-input" id="email" type="email" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Senha</label>
    <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Entrar</button>
  <div class="err" id="errMsg">E-mail ou senha incorretos.</div>
  <div style="text-align:center; margin-top:18px;">
    <a href="#" onclick="forgotPass(); return false" style="color:var(--ink-2); font-size:13px; text-decoration:underline;">Esqueci minha senha</a>
  </div>
  <div class="err" id="okMsg" style="color:#4ade80;">Enviamos um link de redefinição para seu e-mail.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  if (!email || !password) return

  const btn = document.getElementById('loginBtn')
  btn.disabled = true
  btn.textContent = 'Entrando…'

  const { error } = await db.auth.signInWithPassword({ email, password })

  if (error) {
    const errEl = document.getElementById('errMsg')
    errEl.textContent = 'E-mail ou senha incorretos.'
    errEl.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Entrar'
    return
  }

  window.location.href = '/painel/'
}

async function forgotPass() {
  const email = document.getElementById('email').value.trim()
  const errEl = document.getElementById('errMsg')
  const okEl  = document.getElementById('okMsg')
  errEl.style.display = 'none'; okEl.style.display = 'none'
  if (!email) {
    errEl.textContent = 'Digite seu e-mail no campo acima e toque em "Esqueci minha senha".'
    errEl.style.display = 'block'; return
  }
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/painel/nova-senha.html'
  })
  if (error) {
    errEl.textContent = 'Não foi possível enviar o e-mail. Tente de novo em alguns minutos.'
    errEl.style.display = 'block'; return
  }
  okEl.style.display = 'block'
}

// Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })

// Se já logado, vai pro painel
db.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = '/painel/'
})
</script>
</body>
</html>
