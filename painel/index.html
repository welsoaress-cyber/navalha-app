<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Navalha no Bigode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
<style>
  :root {
    --primary: #D4A843;
    --bg: #0F172A;
    --surface: #1E293B;
    --surface-2: #253347;
    --border: #334155;
    --ink: #F8FAFC;
    --ink-2: #94A3B8;
    --ink-3: #475569;
    --green: #22c55e;
    --red: #ef4444;
    --gold: #D4A843;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }

  /* NAV */
  .nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 20px; display: flex; align-items: center; gap: 0;
    position: sticky; top: 0; z-index: 10;
  }
  .nav-brand { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 800; color: var(--primary); padding: 16px 20px 16px 0; border-right: 1px solid var(--border); margin-right: 20px; }
  .nav-tabs { display: flex; gap: 0; flex: 1; }
  .nav-tab { padding: 18px 16px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.18s; white-space: nowrap; }
  .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .nav-tab:hover:not(.active) { color: var(--ink); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .shop-badge { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .btn-logout { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--ink-2); font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.18s; }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* MAIN */
  .content { padding: 24px 20px; max-width: 960px; margin: 0 auto; }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); margin-bottom: 8px; }
  .stat-value { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; color: var(--ink); }
  .stat-value.gold { color: var(--gold); }
  .stat-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

  /* DATE PICKER */
  .date-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .date-input { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-family: inherit; font-size: 14px; outline: none; }
  .date-input:focus { border-color: var(--primary); }
  .date-label { font-size: 14px; font-weight: 600; color: var(--ink-2); }

  /* BOOKINGS TABLE */
  .bookings-list { display: flex; flex-direction: column; gap: 8px; }
  .booking-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; gap: 16px;
  }
  .booking-time { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; color: var(--primary); min-width: 52px; }
  .booking-body { flex: 1; }
  .booking-name { font-weight: 700; font-size: 15px; }
  .booking-detail { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .booking-barber { font-size: 12px; font-weight: 600; background: var(--surface-2); border-radius: 6px; padding: 3px 8px; color: var(--ink-2); white-space: nowrap; }
  .booking-actions { display: flex; gap: 8px; }
  .action-btn { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.18s; color: var(--ink-2); }
  .action-btn.done { border-color: var(--green); color: var(--green); }
  .action-btn.done:hover { background: var(--green); color: #fff; }
  .action-btn.cancel { border-color: var(--red); color: var(--red); }
  .action-btn.cancel:hover { background: var(--red); color: #fff; }
  .status-pill { font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .status-confirmed { background: rgba(212,168,67,0.15); color: var(--gold); }
  .status-completed { background: rgba(34,197,94,0.12); color: var(--green); }
  .status-cancelled { background: rgba(239,68,68,0.12); color: var(--red); }
  .status-no_show { background: var(--surface-2); color: var(--ink-3); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }

  /* SERVICES TAB */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; }
  .btn-add { background: var(--primary); color: #0F172A; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-add:hover { opacity: 0.9; }

  .service-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .service-icon { font-size: 22px; }
  .service-body { flex: 1; }
  .service-name { font-weight: 600; font-size: 15px; }
  .service-detail { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .service-price { font-weight: 700; font-size: 15px; color: var(--primary); }

  .barber-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .barber-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 100%; max-width: 440px; }
  .modal-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; }
  .form-input:focus { border-color: var(--primary); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-modal-cancel { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--ink-2); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-modal-save { flex: 1; padding: 13px; border-radius: 10px; border: none; background: var(--primary); color: #0F172A; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .loading-overlay { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--ink-3); font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .nav-tab { padding: 16px 10px; font-size: 13px; }
    .booking-card { flex-wrap: wrap; }
    .booking-actions { width: 100%; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">💈 Painel</div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('agenda')">Agenda</div>
    <div class="nav-tab" onclick="switchTab('servicos')">Serviços</div>
    <div class="nav-tab" onclick="switchTab('barbeiros')">Barbeiros</div>
  </div>
  <div class="nav-right">
    <div class="shop-badge" id="shopBadge">…</div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>
</nav>

<main class="content" id="content">
  <div class="loading-overlay"><div class="spinner"></div> Carregando…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
let shop = null, barbers = [], services = [], currentTab = 'agenda'
let selectedDate = new Date().toISOString().slice(0,10)

async function init() {
  const { data: { session } } = await db.auth.getSession()
  if (!session) { window.location.href = '/painel/login.html'; return }

  const user = session.user

  const { data: profile } = await db
    .from('barbers')
    .select('*, barbershops(*)')
    .eq('user_id', user.id)
    .maybeSingle()

  let shopData = profile?.barbershops
  if (!shopData) {
    const { data: s } = await db.from('barbershops').select('*').eq('owner_email', user.email).maybeSingle()
    shopData = s
  }

  if (!shopData) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">Sem barbearia vinculada</div><p>Conta sem barbearia associada.</p></div>'
    return
  }

  shop = shopData
  document.getElementById('shopBadge').textContent = shop.name
  document.title = `Painel — ${shop.name}`

  const [{ data: b }, { data: s }] = await Promise.all([
    db.from('barbers').select('*').eq('barbershop_id', shop.id),
    db.from('services').select('*').eq('barbershop_id', shop.id)
  ])
  barbers = b || []
  services = s || []

  renderTab('agenda')
}

function switchTab(tab) {
  currentTab = tab
  document.querySelectorAll('.nav-tab').forEach((el, i) => {
    el.classList.toggle('active', ['agenda','servicos','barbeiros'][i] === tab)
  })
  renderTab(tab)
}

function renderTab(tab) {
  if (tab === 'agenda') renderAgenda()
  else if (tab === 'servicos') renderServicos()
  else if (tab === 'barbeiros') renderBarbeiros()
}

async function renderAgenda() {
  const content = document.getElementById('content')
  content.innerHTML = `
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-label">Hoje</div><div class="stat-value gold" id="statToday">—</div><div class="stat-sub">agendamentos</div></div>
      <div class="stat-card"><div class="stat-label">Semana</div><div class="stat-value" id="statWeek">—</div><div class="stat-sub">agendamentos</div></div>
      <div class="stat-card"><div class="stat-label">Plano</div><div class="stat-value" style="font-size:18px;text-transform:capitalize;" id="statPlan">${shop.plan}</div><div class="stat-sub">${shop.max_barbers} barbeiro${shop.max_barbers > 1 ? 's' : ''}</div></div>
    </div>
    <div class="date-row">
      <span class="date-label">Agenda de:</span>
      <input class="date-input" type="date" id="dateInput" value="${selectedDate}" onchange="changeDate(this.value)">
    </div>
    <div id="bookingsList"><div class="loading-overlay"><div class="spinner"></div> Carregando agenda…</div></div>`

  loadBookings(selectedDate)
  loadStats()
}

async function loadStats() {
  const today = new Date().toISOString().slice(0,10)
  const weekStart = new Date()
  weekStart.setDate(weekStart.getDate() - weekStart.getDay())
  const weekEnd = new Date(weekStart)
  weekEnd.setDate(weekEnd.getDate() + 6)

  const [{ count: todayCount }, { count: weekCount }] = await Promise.all([
    db.from('bookings').select('*', {count:'exact', head:true}).eq('barbershop_id', shop.id).eq('date', today).eq('status','confirmed'),
    db.from('bookings').select('*', {count:'exact', head:true}).eq('barbershop_id', shop.id).gte('date', weekStart.toISOString().slice(0,10)).lte('date', weekEnd.toISOString().slice(0,10)).eq('status','confirmed')
  ])

  const elT = document.getElementById('statToday')
  const elW = document.getElementById('statWeek')
  if (elT) elT.textContent = todayCount || 0
  if (elW) elW.textContent = weekCount || 0
}

async function loadBookings(date) {
  const { data: bookings } = await db.from('bookings')
    .select('*, barbers(name), services(name, duration_minutes)')
    .eq('barbershop_id', shop.id)
    .eq('date', date)
    .order('start_time')

  const container = document.getElementById('bookingsList')
  if (!container) return

  if (!bookings?.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">Nenhum agendamento</div>
        <p>Sem agendamentos para essa data.</p>
      </div>`
    return
  }

  container.innerHTML = '<div class="bookings-list" id="bList"></div>'
  const list = document.getElementById('bList')

  bookings.forEach(bk => {
    const el = document.createElement('div')
    el.className = 'booking-card'
    el.id = `bk-${bk.id}`
    el.innerHTML = `
      <div class="booking-time">${bk.start_time.slice(0,5)}</div>
      <div class="booking-body">
        <div class="booking-name">${bk.client_name}</div>
        <div class="booking-detail">${bk.services?.name || '—'} · ${bk.client_phone}</div>
      </div>
      <div class="booking-barber">${bk.barbers?.name || '—'}</div>
      <span class="status-pill status-${bk.status}">${statusLabel(bk.status)}</span>
      ${bk.status === 'confirmed' ? `
        <div class="booking-actions">
          <button class="action-btn done" onclick="updateStatus('${bk.id}','completed')">✓ Concluído</button>
          <button class="action-btn cancel" onclick="updateStatus('${bk.id}','no_show')">Faltou</button>
        </div>` : ''}
    `
    list.appendChild(el)
  })
}

function statusLabel(s) {
  return {confirmed:'Confirmado', completed:'Concluído', cancelled:'Cancelado', no_show:'Faltou'}[s] || s
}

function changeDate(d) {
  selectedDate = d
  loadBookings(d)
}

async function updateStatus(id, status) {
  await db.from('bookings').update({ status }).eq('id', id)
  loadBookings(selectedDate)
}

function renderServicos() {
  const content = document.getElementById('content')
  content.innerHTML = `
    <div class="section-header">
      <div class="section-title">Serviços</div>
      <button class="btn-add" onclick="openServiceModal()">+ Adicionar</button>
    </div>
    <div id="servicesList"></div>`

  renderServicesList()
}

function renderServicesList() {
  const el = document.getElementById('servicesList')
  if (!el) return
  if (!services.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">✂️</div><div class="empty-title">Nenhum serviço</div><p>Adicione seus serviços para que os clientes possam agendar.</p></div>'
    return
  }
  el.innerHTML = services.map(s => `
    <div class="service-card">
      <div class="service-icon">✂️</div>
      <div class="service-body">
        <div class="service-name">${s.name}</div>
        <div class="service-detail">${s.duration_minutes} min</div>
      </div>
      <div class="service-price">${s.price > 0 ? 'R$ ' + Number(s.price).toFixed(2).replace('.',',') : 'Grátis'}</div>
      <button class="action-btn cancel" onclick="deleteService('${s.id}')">Remover</button>
    </div>`).join('')
}

function openServiceModal() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'serviceModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Novo Serviço</div>
      <div class="form-group">
        <label class="form-label">Nome do serviço</label>
        <input class="form-input" id="svcName" type="text" placeholder="Ex: Corte de cabelo">
      </div>
      <div class="form-group">
        <label class="form-label">Duração (minutos)</label>
        <input class="form-input" id="svcDur" type="number" value="30" min="15" step="15">
      </div>
      <div class="form-group">
        <label class="form-label">Preço (R$)</label>
        <input class="form-input" id="svcPrice" type="number" value="0" min="0" step="0.50" placeholder="0">
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('serviceModal')">Cancelar</button>
        <button class="btn-modal-save" onclick="saveService()">Salvar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

async function saveService() {
  const name = document.getElementById('svcName').value.trim()
  const dur = parseInt(document.getElementById('svcDur').value)
  const price = parseFloat(document.getElementById('svcPrice').value) || 0
  if (!name) return

  const { data } = await db.from('services').insert({ barbershop_id: shop.id, name, duration_minutes: dur, price }).select().single()
  if (data) services.push(data)
  closeModal('serviceModal')
  renderServicesList()
}

async function deleteService(id) {
  if (!confirm('Remover este serviço?')) return
  await db.from('services').delete().eq('id', id)
  services = services.filter(s => s.id !== id)
  renderServicesList()
}

function renderBarbeiros() {
  const maxOk = barbers.filter(b => b.active).length < shop.max_barbers
  const content = document.getElementById('content')
  content.innerHTML = `
    <div class="section-header">
      <div class="section-title">Barbeiros <span style="font-size:14px;font-weight:400;color:var(--ink-3)">${barbers.filter(b=>b.active).length}/${shop.max_barbers} no plano ${shop.plan}</span></div>
      ${maxOk ? `<button class="btn-add" onclick="openBarberModal()">+ Adicionar</button>` : `<span style="font-size:13px;color:var(--ink-3)">Limite do plano atingido</span>`}
    </div>
    <div id="barbersList"></div>`

  renderBarbersList()
}

function renderBarbersList() {
  const el = document.getElementById('barbersList')
  if (!el) return
  if (!barbers.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">💈</div><div class="empty-title">Nenhum barbeiro</div><p>Adicione os barbeiros da sua equipe.</p></div>'
    return
  }
  el.innerHTML = barbers.map(b => `
    <div class="barber-card">
      <div class="barber-avatar">${b.photo_url ? `<img src="${b.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : '💈'}</div>
      <div class="service-body">
        <div class="service-name">${b.name}</div>
        <div class="service-detail">${b.active ? 'Ativo' : 'Inativo'}</div>
      </div>
      <button class="action-btn cancel" onclick="deleteBarber('${b.id}')">Remover</button>
    </div>`).join('')
}

function openBarberModal() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'barberModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Novo Barbeiro</div>
      <div class="form-group">
        <label class="form-label">Nome</label>
        <input class="form-input" id="bName" type="text" placeholder="Ex: João">
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('barberModal')">Cancelar</button>
        <button class="btn-modal-save" onclick="saveBarber()">Salvar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

async function saveBarber() {
  const name = document.getElementById('bName').value.trim()
  if (!name) return
  const { data } = await db.from('barbers').insert({ barbershop_id: shop.id, name }).select().single()
  if (data) barbers.push(data)
  closeModal('barberModal')
  renderBarbeiros()
}

async function deleteBarber(id) {
  if (!confirm('Remover este barbeiro?')) return
  await db.from('barbers').delete().eq('id', id)
  barbers = barbers.filter(b => b.id !== id)
  renderBarbersList()
}

function closeModal(id) { document.getElementById(id)?.remove() }

async function doLogout() {
  await db.auth.signOut()
  window.location.href = '/painel/login.html'
}

init()
</script>
</body>
</html>
