<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Navalha no Bigode</title>
<link rel="manifest" href="/painel/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
<style>
  :root {
    --primary: #D4A843;
    --bg: #0F172A;
    --surface: #1E293B;
    --surface-2: #253347;
    --border: #334155;
    --ink: #F8FAFC;
    --ink-2: #94A3B8;
    --ink-3: #475569;
    --green: #22c55e;
    --red: #ef4444;
    --gold: #D4A843;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }

  /* NAV */
  .nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 20px; display: flex; align-items: center; gap: 0;
    position: sticky; top: 0; z-index: 10;
  }
  .nav-brand { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 800; color: var(--primary); padding: 16px 20px 16px 0; border-right: 1px solid var(--border); margin-right: 20px; }
  .nav-tabs { display: flex; gap: 0; flex: 1; }
  .nav-tab { padding: 18px 16px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.18s; white-space: nowrap; }
  .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .nav-tab:hover:not(.active) { color: var(--ink); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .shop-badge { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .btn-logout { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--ink-2); font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.18s; }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* MAIN */
  .content { padding: 24px 20px; max-width: 960px; margin: 0 auto; }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); margin-bottom: 8px; }
  .stat-value { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; color: var(--ink); }
  .stat-value.gold { color: var(--gold); }
  .stat-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

  /* DATE PICKER */
  .date-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .date-input { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-family: inherit; font-size: 14px; outline: none; }
  .date-input:focus { border-color: var(--primary); }
  .date-label { font-size: 14px; font-weight: 600; color: var(--ink-2); }

  /* BOOKINGS TABLE */
  .bookings-list { display: flex; flex-direction: column; gap: 8px; }
  .booking-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; gap: 16px;
  }
  .booking-time { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; color: var(--primary); min-width: 52px; }
  .booking-body { flex: 1; }
  .booking-name { font-weight: 700; font-size: 15px; }
  .booking-detail { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .booking-barber { font-size: 12px; font-weight: 600; background: var(--surface-2); border-radius: 6px; padding: 3px 8px; color: var(--ink-2); white-space: nowrap; }
  .booking-actions { display: flex; gap: 8px; }
  .action-btn { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.18s; color: var(--ink-2); }
  .action-btn.done { border-color: var(--green); color: var(--green); }
  .action-btn.done:hover { background: var(--green); color: #fff; }
  .action-btn.cancel { border-color: var(--red); color: var(--red); }
  .action-btn.cancel:hover { background: var(--red); color: #fff; }
  .status-pill { font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .status-confirmed { background: rgba(212,168,67,0.15); color: var(--gold); }
  .status-completed { background: rgba(34,197,94,0.12); color: var(--green); }
  .status-cancelled { background: rgba(239,68,68,0.12); color: var(--red); }
  .status-no_show { background: var(--surface-2); color: var(--ink-3); }
  .status-blocked { background: rgba(148,163,184,0.15); color: var(--ink-2); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }

  /* SERVICES TAB */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; }
  .btn-add { background: var(--primary); color: #0F172A; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-add:hover { opacity: 0.9; }

  .service-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .service-icon { font-size: 22px; }
  .service-body { flex: 1; }
  .service-name { font-weight: 600; font-size: 15px; }
  .service-detail { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .service-price { font-weight: 700; font-size: 15px; color: var(--primary); }

  .barber-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .barber-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 100%; max-width: 440px; }
  .modal-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; }
  .form-select { padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 14px; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; }
  .week-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px 12px; margin-bottom: 16px; }
  .week-title { font-size: 12px; font-weight: 700; color: var(--ink-3, #64748b); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; padding-left: 4px; }
  .week-row { display: flex; gap: 6px; }
  .wk-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 10px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; }
  .wk-day:hover { background: rgba(212,168,67,0.06); }
  .wk-day.active { border-color: var(--primary); background: rgba(212,168,67,0.1); }
  .wk-count { font-size: 13px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .wk-bar { width: 100%; max-width: 26px; height: 44px; background: rgba(148,163,184,0.12); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
  .wk-bar > div { width: 100%; background: var(--primary); border-radius: 6px 6px 0 0; transition: height 0.3s; }
  .wk-label { font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .wk-date { font-size: 10px; color: var(--ink-3, #64748b); font-variant-numeric: tabular-nums; }
  .booking-service { color: var(--primary); font-weight: 600; }
  .form-hint { font-size: 12px; color: var(--ink-3, #64748b); margin-top: 4px; }
  .form-input:focus { border-color: var(--primary); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-modal-cancel { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--ink-2); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-modal-save { flex: 1; padding: 13px; border-radius: 10px; border: none; background: var(--primary); color: #0F172A; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .locked-blur { filter: blur(7px); pointer-events: none; user-select: none; }
  #billingLock { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(15,23,42,0.45); }
  #billingLock .lock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px 26px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  #billingLock .lock-count { background: rgba(212,168,67,0.12); border: 1px solid rgba(212,168,67,0.35); border-radius: 12px; padding: 14px; margin: 16px 0; font-size: 14px; font-weight: 600; color: var(--ink); }
  #billingLock .btn-pay { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: #0F172A; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; }

  .loading-overlay { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--ink-3); font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .nav-tab { padding: 16px 10px; font-size: 13px; }
    .booking-card { flex-wrap: wrap; }
    .booking-actions { width: 100%; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">💈 Painel</div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('agenda')">Agenda</div>
    <div class="nav-tab" onclick="switchTab('servicos')">Serviços</div>
    <div class="nav-tab" onclick="switchTab('barbeiros')">Equipe</div>
    <div class="nav-tab" onclick="switchTab('comissoes')">Comissões</div>
  </div>
  <div class="nav-right">
    <div class="shop-badge" id="shopBadge">…</div>
    <button class="btn-logout" style="border-color:rgba(212,168,67,0.4);" onclick="pedirCartoes()">💳 Cartões</button>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>
</nav>

<main class="content" id="content">
  <div class="loading-overlay"><div class="spinner"></div> Carregando…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
let shop = null, barbers = [], services = [], currentTab = 'agenda'
let role = 'owner', myBarber = null
let selectedDate = new Date().toISOString().slice(0,10)

function showInitError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">Erro ao carregar</div>
      <p style="margin-bottom:16px;">${msg || 'Sem conexão ou sessão expirada.'}</p>
      <button class="btn" onclick="window.location.reload()" style="background:var(--gold);color:#07060A;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Tentar novamente</button>
    </div>`
}

async function init() {
  // Timeout de 12 s — se a rede travar o spinner some e aparece botão de retry
  const timeoutId = setTimeout(() => showInitError('Conexão lenta. Verifique sua internet e tente novamente.'), 12000)
  try {
    const { data: { session }, error: sessErr } = await db.auth.getSession()
    if (sessErr) throw sessErr
    if (!session) { clearTimeout(timeoutId); window.location.href = '/painel/login.html'; return }

    const user = session.user

    // Dono da barbearia?
    const { data: ownShop } = await db.from('barbershops').select('*').eq('owner_email', user.email).maybeSingle()
    let shopData = ownShop

    // Se não é dono, é barbeiro da equipe?
    if (!shopData) {
      const { data: me } = await db.from('barbers').select('*').eq('email', user.email.toLowerCase()).maybeSingle()
      if (me) {
        role = 'barber'
        myBarber = me
        const { data: s2 } = await db.from('barbershops').select('*').eq('id', me.barbershop_id).maybeSingle()
        shopData = s2
      }
    }

    if (!shopData) {
      clearTimeout(timeoutId)
      document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">Sem barbearia vinculada</div><p>Conta sem barbearia associada.</p></div>'
      return
    }

    shop = shopData
    document.getElementById('shopBadge').textContent = role === 'barber' ? `${shop.name} · ${myBarber.name}` : shop.name
    document.title = `Painel — ${shop.name}`

    // Barbeiro da equipe só vê a própria agenda
    if (role === 'barber') {
      document.querySelectorAll('.nav-tab').forEach((el, i) => { if (i > 0) el.style.display = 'none' })
    }

    // Plano Solo: a aba vira "Meus horários" (não existe equipe)
    if (role === 'owner' && shop.max_barbers === 1) {
      const tabs = document.querySelectorAll('.nav-tab')
      if (tabs[2]) tabs[2].textContent = 'Meus horários'
    }

    const [{ data: b }, { data: s }] = await Promise.all([
      db.from('barbers').select('*').eq('barbershop_id', shop.id),
      db.from('services').select('*').eq('barbershop_id', shop.id)
    ])
    barbers = b || []
    services = s || []

    clearTimeout(timeoutId)
    renderTab('agenda')
    checkBillingLock()
  } catch (err) {
    clearTimeout(timeoutId)
    console.error('init error:', err)
    showInitError('Erro inesperado. Tente novamente ou faça login novamente.')
  }
}

// ── Bloqueio por mensalidade vencida: agenda fica visível, mas borrada.
//    O Pix já aparece pronto — a única saída é pagar.
function hojeBR() { return new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10) }
function dataBR(d) { return d.slice(8, 10) + '/' + d.slice(5, 7) }

async function checkBillingLock() {
  if (!shop.next_due || shop.next_due >= hojeBR()) return

  document.querySelector('.nav').classList.add('locked-blur')
  document.getElementById('content').classList.add('locked-blur')

  const { count } = await db.from('bookings').select('*', { count: 'exact', head: true })
    .eq('barbershop_id', shop.id).gte('date', hojeBR()).eq('status', 'confirmed')

  const overlay = document.createElement('div')
  overlay.id = 'billingLock'
  overlay.innerHTML = `
    <div class="lock-card" id="lockCard">
      <div style="font-size:38px;margin-bottom:8px;">🔒</div>
      <div style="font-size:19px;font-weight:800;margin-bottom:6px;">Mensalidade vencida</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.6;">Venceu dia <strong style="color:var(--ink);">${dataBR(shop.next_due)}</strong>. Seus clientes continuam agendando normalmente.</div>
      ${count > 0 ? `<div class="lock-count">✂️ Você tem <strong>${count} cliente${count > 1 ? 's' : ''} agendado${count > 1 ? 's' : ''}</strong> te esperando</div>` : '<div style="height:12px;"></div>'}
      <div id="payArea" style="font-size:14px;color:var(--ink-2);">Gerando seu Pix…</div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:10px;">Pagou, liberou. Na hora, sem falar com ninguém.</div>
    </div>`
  document.body.appendChild(overlay)
  payMensalidade()
}

let _payPoll = null
async function payMensalidade() {
  const area = document.getElementById('payArea')
  area.innerHTML = 'Gerando seu Pix…'
  try {
    const r = await fetch('/api/renew-pix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ barbershop_id: shop.id }) })
    const d = await r.json()
    if (!d.qr_base64) throw new Error('sem qr')
    area.innerHTML = `
      ${d.birthday ? '<div style="font-size:13px;color:var(--primary);font-weight:700;margin-bottom:6px;">🎂 Mês do seu aniversário: 10% de desconto aplicado!</div>' : ''}
      <div style="font-size:17px;font-weight:800;margin-bottom:10px;">Pix de R$ ${d.amount}</div>
      <img src="data:image/png;base64,${d.qr_base64}" style="width:190px;border-radius:12px;background:#fff;padding:8px;" alt="QR Code Pix">
      <input id="cecPay" readonly value="${d.qr_code}" style="width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink-2);font-size:11px;">
      <button class="btn-pay" id="btnCopiaPay" onclick="copiaPix()" style="margin-top:8px;">📋 Copiar código Pix</button>`
    _payPoll = setInterval(async () => {
      try {
        const s = await fetch('/api/pix-status?id=' + d.payment_id).then(x => x.json())
        if (s.status === 'approved') {
          clearInterval(_payPoll)
          document.getElementById('lockCard').innerHTML = `
            <div style="font-size:44px;margin-bottom:10px;">✅</div>
            <div style="font-size:19px;font-weight:800;color:var(--green);margin-bottom:8px;">Pagamento confirmado!</div>
            <div style="font-size:14px;color:var(--ink-2);">Liberando seu painel…</div>`
          setTimeout(() => window.location.reload(), 1800)
        }
      } catch (e) {}
    }, 5000)
  } catch (e) {
    area.innerHTML = `
      <div style="font-size:13px;color:#f87171;margin-bottom:8px;">Não foi possível gerar o Pix.</div>
      <button class="btn-pay" onclick="payMensalidade()">Tentar de novo</button>`
  }
}

function copiaPix() {
  const cec = document.getElementById('cecPay')
  cec.select(); cec.setSelectionRange(0, 99999)
  navigator.clipboard.writeText(cec.value).catch(() => document.execCommand('copy'))
  const b = document.getElementById('btnCopiaPay')
  b.textContent = '✅ Copiado!'
  setTimeout(() => { if (b) b.textContent = '📋 Copiar código Pix' }, 2500)
}

function switchTab(tab) {
  currentTab = tab
  document.querySelectorAll('.nav-tab').forEach((el, i) => {
    el.classList.toggle('active', ['agenda','servicos','barbeiros','comissoes'][i] === tab)
  })
  renderTab(tab)
}

function renderTab(tab) {
  if (tab === 'agenda') renderAgenda()
  else if (tab === 'servicos') renderServicos()
  else if (tab === 'barbeiros') renderBarbeiros()
  else if (tab === 'comissoes') renderComissoes()
}

async function renderAgenda() {
  const content = document.getElementById('content')
  content.innerHTML = `
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-label">Hoje</div><div class="stat-value gold" id="statToday">—</div><div class="stat-sub">agendamentos</div></div>
      <div class="stat-card"><div class="stat-label">Semana</div><div class="stat-value" id="statWeek">—</div><div class="stat-sub">agendamentos</div></div>
      <div class="stat-card"><div class="stat-label">Plano</div><div class="stat-value" style="font-size:18px;text-transform:capitalize;" id="statPlan">${shop.plan}</div><div class="stat-sub">${shop.max_barbers} profission${shop.max_barbers > 1 ? 'ais' : 'al'}</div></div>
    </div>
    <div class="week-card">
      <div class="week-title">Sua semana</div>
      <div class="week-row" id="weekRow"><div class="loading-overlay"><div class="spinner"></div></div></div>
    </div>
    <div class="date-row">
      <span class="date-label">Agenda de:</span>
      <input class="date-input" type="date" id="dateInput" value="${selectedDate}" onchange="changeDate(this.value)">
      ${selectedDate === hojeBR() ? `<button class="action-btn" style="margin-left:auto;border-color:rgba(212,168,67,0.5);color:var(--gold);" onclick="libereiMaisCedo()">⚡ Liberei mais cedo</button>` : ''}
      <button class="action-btn cancel" ${selectedDate === hojeBR() ? '' : 'style="margin-left:auto;"'} onclick="closeDay()">🚫 Fechar este dia</button>
    </div>
    <div id="bookingsList"><div class="loading-overlay"><div class="spinner"></div> Carregando agenda…</div></div>`

  loadBookings(selectedDate)
  loadWeekOverview()
  loadStats()
}

// Visão semanal: gráfico de barras clicável (Dom a Sáb)
async function loadWeekOverview() {
  const el = document.getElementById('weekRow')
  if (!el) return
  const base = new Date(selectedDate + 'T12:00:00')
  const ws = new Date(base); ws.setDate(ws.getDate() - ws.getDay())
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(ws); d.setDate(ws.getDate() + i)
    return d.toISOString().slice(0, 10)
  })

  let q = db.from('bookings').select('date')
    .eq('barbershop_id', shop.id)
    .gte('date', days[0]).lte('date', days[6])
    .neq('status', 'cancelled')
  if (role === 'barber') q = q.eq('barber_id', myBarber.id)
  const { data } = await q

  const counts = {}
  days.forEach(d => counts[d] = 0)
  ;(data || []).forEach(b => { if (counts[b.date] !== undefined) counts[b.date]++ })
  const max = Math.max(1, ...Object.values(counts))

  el.innerHTML = days.map((d, i) => `
    <div class="wk-day ${d === selectedDate ? 'active' : ''}" onclick="changeDate('${d}')">
      <div class="wk-count">${counts[d]}</div>
      <div class="wk-bar"><div style="height:${Math.max(4, Math.round(counts[d] / max * 100))}%"></div></div>
      <div class="wk-label">${DIAS[i]}</div>
      <div class="wk-date">${d.slice(8,10)}/${d.slice(5,7)}</div>
    </div>`).join('')
}

async function loadStats() {
  const today = new Date().toISOString().slice(0,10)
  const weekStart = new Date()
  weekStart.setDate(weekStart.getDate() - weekStart.getDay())
  const weekEnd = new Date(weekStart)
  weekEnd.setDate(weekEnd.getDate() + 6)

  let qToday = db.from('bookings').select('*', {count:'exact', head:true}).eq('barbershop_id', shop.id).eq('date', today).eq('status','confirmed')
  let qWeek  = db.from('bookings').select('*', {count:'exact', head:true}).eq('barbershop_id', shop.id).gte('date', weekStart.toISOString().slice(0,10)).lte('date', weekEnd.toISOString().slice(0,10)).eq('status','confirmed')
  if (role === 'barber') { qToday = qToday.eq('barber_id', myBarber.id); qWeek = qWeek.eq('barber_id', myBarber.id) }
  const [{ count: todayCount }, { count: weekCount }] = await Promise.all([qToday, qWeek])

  const elT = document.getElementById('statToday')
  const elW = document.getElementById('statWeek')
  if (elT) elT.textContent = todayCount || 0
  if (elW) elW.textContent = weekCount || 0
}

async function loadBookings(date) {
  let q = db.from('bookings')
    .select('*, barbers(name), services(name, duration_minutes)')
    .eq('barbershop_id', shop.id)
    .eq('date', date)
    .order('start_time')
  if (role === 'barber') q = q.eq('barber_id', myBarber.id)
  const { data: bookings } = await q

  const container = document.getElementById('bookingsList')
  if (!container) return

  if (!bookings?.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">Nenhum agendamento</div>
        <p>Sem agendamentos para essa data.</p>
      </div>`
    return
  }

  container.innerHTML = '<div class="bookings-list" id="bList"></div>'
  const list = document.getElementById('bList')

  // Cliente atrasado: horário de hoje que já passou e segue "confirmado"
  const agoraBR = new Date(Date.now() - 3 * 3600 * 1000)
  const minAgora = agoraBR.getUTCHours() * 60 + agoraBR.getUTCMinutes()
  const ehHoje = selectedDate === hojeBR()

  bookings.forEach(bk => {
    const [bh, bm] = String(bk.start_time).split(':').map(Number)
    const atrasado = ehHoje && bk.status === 'confirmed' && (bh * 60 + bm) < minAgora
    const el = document.createElement('div')
    el.className = 'booking-card'
    el.id = `bk-${bk.id}`
    el.innerHTML = `
      <div class="booking-time">${bk.start_time.slice(0,5)}</div>
      <div class="booking-body">
        <div class="booking-name">${bk.client_name}</div>
        <div class="booking-detail"><span class="booking-service">✂️ ${bk.services?.name || 'Serviço'}${bk.services?.duration_minutes ? ' · ' + bk.services.duration_minutes + 'min' : ''}</span></div>
        <div class="booking-detail">📞 ${bk.client_phone}</div>
        ${bk.notes ? `<div class="booking-detail" style="color:var(--gold);">💬 ${esc(bk.notes)}</div>` : ''}
      </div>
      <div class="booking-barber">${bk.barbers?.name || '—'}</div>
      <span class="status-pill status-${bk.status}">${statusLabel(bk.status)}</span>
      ${bk.status === 'confirmed' ? `
        <div class="booking-actions">
          ${atrasado ? `<button class="action-btn" id="late-${bk.id}" style="border-color:rgba(212,168,67,0.5);color:var(--gold);" onclick="askComing('${bk.id}')">🕐 Tá chegando?</button>` : ''}
          <button class="action-btn done" onclick="updateStatus('${bk.id}','completed')">✓ Concluído</button>
          <button class="action-btn cancel" onclick="updateStatus('${bk.id}','no_show')">Faltou</button>
          <button class="action-btn cancel" onclick="cancelBooking('${bk.id}')">✕ Cancelar</button>
        </div>` : ''}
    `
    list.appendChild(el)
  })
}

// ⚡ Liberei mais cedo: oferece ao próximo cliente de hoje vir agora
async function libereiMaisCedo() {
  const { data: barbers } = await db.from('barbers').select('id,name')
    .eq('barbershop_id', shop.id).eq('active', true)
  if (!barbers || !barbers.length) { alert('Nenhum profissional ativo.'); return }

  // Mais de um profissional: pergunta qual liberou
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'

  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">⚡ Quem liberou mais cedo?</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${barbers.map(b => `<button class="btn-modal-save" onclick="document.getElementById('freeNowModal').remove(); enviarFreeNow('${b.id}', '${b.name.replace(/'/g, '')}')">${b.name}</button>`).join('')}
      </div>
      <div class="modal-actions" style="margin-top:12px;">

async function enviarFreeNow(barberId, barberName) {
  try {
    const r = await fetch('/api/free-now', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barbershop_id: shop.id, barber_id: barberId })
    })
    const d = await r.json()
    if (d.ok) alert(`⚡ Oferta enviada!\n\n${d.client} (horário das ${d.at}) recebeu no WhatsApp o convite pra vir agora. Se recusar ou não responder, o robô tenta o próximo da fila.`)
    else if (d.already) alert(`Já tem uma oferta em andamento pra ${d.client}. Aguarda a resposta dele.`)
    else if (d.none) alert(`${barberName ? barberName + ' não tem' : 'Não tem'} mais clientes confirmados hoje pra antecipar.`)
    else alert('Não consegui enviar a oferta. Tenta de novo.')
  } catch (e) { alert('Falha de conexão. Tenta de novo.') }
}

// Cliente atrasado: robô pergunta no WhatsApp se ele está a caminho
async function askComing(id) {
  const btn = document.getElementById('late-' + id)
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…' }
  try {
    const r = await fetch('/api/notify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ booking_id: id, type: 'late_check' })
    })
    const d = await r.json()
    if (btn) btn.textContent = d.sent ? '✅ Perguntado' : '📵 Não enviou'
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '🕐 Tá chegando?' }
  }
}

// ── Pedir cartões: Pix na hora (1º kit pra quem entrou pelo teste; reposição pra quem já pagou) ──
let _cardPoll = null
function pedirCartoes() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'cardsModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">💳 Pedir cartões com QR Code</div>
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 14px;">Cartões físicos com o QR Code da sua barbearia — o cliente escaneia e agenda na hora. Produção e envio em até <strong>15 dias úteis</strong> após o pagamento.</p>
      <div id="cardsPayArea" style="text-align:center;">
        <button class="btn-modal-save" style="width:100%;" onclick="gerarPixCartoes()">Gerar Pix do pedido</button>
      </div>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn-modal-cancel" style="flex:1;" onclick="fecharCartoes()">Fechar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

function fecharCartoes() {
  if (_cardPoll) { clearInterval(_cardPoll); _cardPoll = null }
  document.getElementById('cardsModal')?.remove()
}

async function gerarPixCartoes() {
  const area = document.getElementById('cardsPayArea')
  area.innerHTML = '<span class="spinner"></span> Gerando seu Pix…'
  try {
    const r = await fetch('/api/cards-pix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ barbershop_id: shop.id }) })
    const d = await r.json()
    if (!d.qr_base64) throw new Error(d.error || 'sem qr')
    area.innerHTML = `
      <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:6px;">${d.primeiro ? 'Primeiro kit do plano (cartões + configuração)' : 'Remessa de reposição'}</div>
      <div style="font-size:17px;font-weight:800;margin-bottom:10px;">Pix de R$ ${d.amount}</div>
      <img src="data:image/png;base64,${d.qr_base64}" style="width:180px;border-radius:12px;background:#fff;padding:8px;" alt="QR Code Pix">
      <input id="cecCards" readonly value="${d.qr_code}" style="width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink-2);font-size:11px;">
      <button class="btn-modal-save" id="btnCopiaCards" style="width:100%;margin-top:8px;" onclick="copiaPixCartoes()">📋 Copiar código Pix</button>
      <div id="cardsStatus" style="margin-top:10px;font-size:13px;color:var(--ink-2);">⏳ Aguardando pagamento…</div>`
    _cardPoll = setInterval(async () => {
      try {
        const s = await fetch('/api/pix-status?id=' + d.payment_id).then(x => x.json())
        if (s.status === 'approved') {
          clearInterval(_cardPoll); _cardPoll = null
          area.innerHTML = `
            <div style="font-size:40px;margin-bottom:8px;">✅</div>
            <div style="font-size:16px;font-weight:800;color:var(--green);margin-bottom:6px;">Pedido confirmado!</div>
            <div style="font-size:13.5px;color:var(--ink-2);line-height:1.6;">Seus cartões entram em produção e chegam em até 15 dias úteis. Você recebeu a confirmação no WhatsApp.</div>`
        }
      } catch (e) {}
    }, 5000)
  } catch (e) {
    area.innerHTML = `
      <div style="font-size:13px;color:#f87171;margin-bottom:8px;">Não foi possível gerar o Pix.</div>
      <button class="btn-modal-save" onclick="gerarPixCartoes()">Tentar de novo</button>`
  }
}

function copiaPixCartoes() {
  const cec = document.getElementById('cecCards')
  cec.select(); cec.setSelectionRange(0, 99999)
  navigator.clipboard.writeText(cec.value).catch(() => document.execCommand('copy'))
  const b = document.getElementById('btnCopiaCards')
  b.textContent = '✅ Copiado!'
  setTimeout(() => { if (b) b.textContent = '📋 Copiar código Pix' }, 2500)
}

function statusLabel(s) {

// Escapa texto digitado pelo cliente antes de injetar no HTML
function esc(t) {
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

// Caixa de confirmação própria, com botões Sim / Não
function askConfirm(msg) {
  return new Promise(resolve => {
    const o = document.createElement('div')
    o.className = 'modal-overlay'
    o.innerHTML = `
      <div class="modal" style="max-width:340px;text-align:center;">
        <p style="font-size:15px;line-height:1.6;margin-bottom:22px;">${msg}</p>
        <div class="modal-actions">
          <button class="btn-modal-cancel" id="ncBtn">Não</button>
          <button class="btn-modal-save" id="ycBtn">Sim</button>
        </div>
      </div>`
    document.body.appendChild(o)
    o.querySelector('#ycBtn').onclick = () => { o.remove(); resolve(true) }
    o.querySelector('#ncBtn').onclick = () => { o.remove(); resolve(false) }
  })
}

// Mensagem pronta de cancelamento para o cliente
function cancelMsgLink(bk) {
  const [ano, mes, dia] = bk.date.split('-')
  const linkApp = `https://${shop.slug}.navalhanobigode.com.br`
  const msg = encodeURIComponent(
    `Olá, ${bk.client_name}! Aqui é da ${shop.name}. 💈\n\n` +
    `Infelizmente precisei desmarcar seu horário de ${dia}/${mes} às ${bk.start_time.slice(0,5)}` +
    `${bk.services?.name ? ' (' + bk.services.name + ')' : ''} por um imprevisto. Me desculpe!\n\n` +
    `Você pode escolher um novo horário por aqui: ${linkApp}`
  )
  const phone = String(bk.client_phone || '').replace(/\D/g, '')
  return phone ? `https://wa.me/55${phone}?text=${msg}` : null
}

// Cancela um horário e abre o WhatsApp com a mensagem pronta
async function cancelBooking(id) {
  const { data: bk } = await db.from('bookings')
    .select('*, services(name)')
    .eq('id', id).maybeSingle()
  if (!bk) return
  if (!(await askConfirm(`Cancelar o horário de <strong>${bk.client_name}</strong> às <strong>${bk.start_time.slice(0,5)}</strong>?`))) return

  await db.from('bookings').update({ status: 'cancelled' }).eq('id', id)
  loadBookings(selectedDate)
  loadWeekOverview()

  // Vaga liberada: dispara o efeito cascata (oferece antecipação a quem vem depois)
  fetch('/api/cascade', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ booking_id: id })
  }).catch(() => {})

  // Aviso automático no WhatsApp do cliente; se falhar, abre o manual
  try {
    const r = await fetch('/api/notify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ booking_id: id, type: 'cancel_by_shop' })
    })
    const d = await r.json().catch(() => ({}))
    if (d.sent) { alert(`✅ ${bk.client_name} foi avisado automaticamente no WhatsApp.`); return }
  } catch (e) {}
  const link = cancelMsgLink(bk)
  if (link) window.open(link, '_blank')
}

// Fecha o dia inteiro: bloqueia novos agendamentos e lista os clientes para avisar
async function closeDay() {
  const [ano, mes, dia] = selectedDate.split('-')
  if (!(await askConfirm(`Fechar o dia <strong>${dia}/${mes}</strong>?<br><br><span style="font-size:13px;color:var(--ink-2);">Ninguém mais agenda nesse dia, os horários existentes são desmarcados e os clientes são avisados automaticamente.</span>`))) return

  const alvo = role === 'barber' ? [myBarber] : barbers.filter(b => b.active)
  const problemas = []

  // Fecha o dia para os barbeiros (novos agendamentos bloqueados)
  for (const b of alvo) {
    const { error } = await db.from('blocked_days').upsert({ barber_id: b.id, date: selectedDate }, { onConflict: 'barber_id,date' })
    if (error) problemas.push('Bloquear dia de ' + b.name + ': ' + error.message)
  }

  // Busca os agendamentos ativos do dia
  let q = db.from('bookings').select('*, services(name)')
    .eq('barbershop_id', shop.id).eq('date', selectedDate).eq('status', 'confirmed')
  if (role === 'barber') q = q.eq('barber_id', myBarber.id)
  const { data: afetados, error: qErr } = await q
  if (qErr) problemas.push('Buscar agendamentos: ' + qErr.message)

  // Desmarca e avisa cada cliente automaticamente no WhatsApp
  const resultados = []
  for (const bk of (afetados || [])) {
    const { error: uErr } = await db.from('bookings').update({ status: 'blocked' }).eq('id', bk.id)
    if (uErr) { problemas.push('Desmarcar ' + bk.client_name + ': ' + uErr.message); continue }
    let ok = false
    try {
      const r = await fetch('/api/notify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ booking_id: bk.id, type: 'cancel_by_shop' })
      })
      const d = await r.json().catch(() => ({}))
      ok = !!d.sent
    } catch (e) {}
    resultados.push({ bk, ok })
  }

  // Prova real: sobrou alguém confirmado neste dia?
  let vq = db.from('bookings').select('id', { count: 'exact', head: true })
    .eq('barbershop_id', shop.id).eq('date', selectedDate).eq('status', 'confirmed')
  if (role === 'barber') vq = vq.eq('barber_id', myBarber.id)
  const { count: restantes } = await vq
  if (restantes > 0) problemas.push(restantes + ' agendamento(s) ainda constam como confirmados — tente fechar o dia de novo.')
  if (problemas.length) alert('⚠️ Atenção:\n\n' + problemas.join('\n'))

  loadBookings(selectedDate)
  loadWeekOverview()

  // Resumo: quem foi avisado automaticamente e quem precisa de aviso manual
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'notifyModal'
  const lista = resultados.length
    ? resultados.map(({ bk, ok }) => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);">
          <div style="flex:1;">
            <div style="font-weight:700;">${bk.client_name}</div>
            <div style="font-size:12px;color:var(--ink-2);">${bk.start_time.slice(0,5)} · ${bk.services?.name || ''}</div>
          </div>
          ${ok
            ? '<span style="color:var(--green,#22c55e);font-size:13px;font-weight:700;">✅ Avisado</span>'
            : (cancelMsgLink(bk) ? `<a class="btn-add" style="text-decoration:none;font-size:13px;padding:9px 14px;" href="${cancelMsgLink(bk)}" target="_blank">📱 Avisar manualmente</a>` : '')}
        </div>`).join('')
    : '<p style="color:var(--ink-2);font-size:14px;">Nenhum cliente tinha horário marcado nesse dia.</p>'

  overlay.innerHTML = `
    <div class="modal" style="max-height:85dvh;overflow-y:auto;">
      <div class="modal-title">✅ Dia ${dia}/${mes} fechado</div>
      <p style="font-size:13px;color:var(--ink-2);margin-bottom:12px;">Avisos enviados automaticamente pelo WhatsApp:</p>
      ${lista}
      <div class="modal-actions">
        <button class="btn-modal-save" onclick="document.getElementById('notifyModal').remove()">Concluído</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

  const el = document.getElementById('barbersList')
  if (!el) return
  if (!barbers.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">💈</div><div class="empty-title">Ninguém na equipe ainda</div><p>Adicione os profissionais da sua equipe.</p></div>'
    return
  }
  const solo = shop.max_barbers === 1
  el.innerHTML = barbers.map(b => `
    <div class="barber-card">
      <div class="barber-avatar">${b.photo_url ? `<img src="${b.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : '💈'}</div>
      <div class="service-body">
        <div class="service-name">${b.name}</div>
        <div class="service-detail">${solo ? 'Você' : (b.email ? '🔓 Acesso: ' + b.email : 'Sem acesso ao painel')}</div>
      </div>
      ${solo || b.email ? '' : `<button class="action-btn" onclick="openAccessModal('${b.id}')">🔐 Criar acesso</button>`}
      <button class="action-btn" onclick="openHoursModal('${b.id}')">🕐 Horários</button>
      ${solo ? '' : `<button class="action-btn cancel" onclick="deleteBarber('${b.id}')">Remover</button>`}
    </div>`).join('')
}

// Cliente auxiliar: cria a conta do barbeiro sem derrubar a sessão do dono
const dbAux = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } })

async function createBarberAccount(email, pass) {
  const { data, error } = await dbAux.auth.signUp({ email, password: pass })
  if (error) {
    if (error.message?.toLowerCase().includes('already') || error.message?.toLowerCase().includes('registered')) {
      return { userId: null, err: 'Este e-mail já tem conta no sistema. Use outro e-mail.' }
    }
    return { userId: null, err: error.message }
  }
  return { userId: data.user?.id || null, err: null }
}

function openBarberModal() {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'barberModal'
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Novo Barbeiro</div>
      <div class="form-group">
        <label class="form-label">Nome</label>
        <input class="form-input" id="bName" type="text" placeholder="Ex: João">
      </div>
      <div class="form-group">
        <label class="form-label">E-mail do profissional (para acessar a própria agenda)</label>
        <input class="form-input" id="bEmail" type="email" placeholder="joao@email.com (opcional)">
      </div>
      <div class="form-group">
        <label class="form-label">Senha inicial</label>
        <input class="form-input" id="bPass" type="text" placeholder="Mínimo 6 caracteres — passe a ele depois">
        <div class="form-hint">Ele entra em ${window.location.origin}/painel/ com esse e-mail e senha, e vê só a agenda dele.</div>
      </div>

        <button class="btn-modal-save" id="bSave" onclick="saveBarber()">Salvar</button>

async function saveBarber() {
  const name  = document.getElementById('bName').value.trim()
  const email = document.getElementById('bEmail').value.trim().toLowerCase()
  const pass  = document.getElementById('bPass').value
  const errEl = document.getElementById('bErr')
  errEl.style.display = 'none'
  if (!name) return
  if (email && pass.length < 6) {
    errEl.textContent = 'Para dar acesso, a senha inicial precisa de pelo menos 6 caracteres.'
    errEl.style.display = 'block'; return
  }

  const btn = document.getElementById('bSave')
  btn.disabled = true; btn.textContent = 'Salvando…'

  let userId = null
  if (email) {
    const acc = await createBarberAccount(email, pass)
    if (acc.err) {
      btn.disabled = false; btn.textContent = 'Salvar'
      errEl.textContent = acc.err
      errEl.style.display = 'block'; return
    }
    userId = acc.userId
  }

  const { data } = await db.from('barbers').insert({
    barbershop_id: shop.id, name,
    email: email || null, user_id: userId
  }).select().single()
  if (data) barbers.push(data)
  closeModal('barberModal')
  renderBarbeiros()
  // Já abre a definição de dias e horários do barbeiro novo
  if (data) openHoursModal(data.id)
}

        <div class="form-hint">Ele entra em ${window.location.origin}/painel/ e vê só a agenda dele.</div>
      </div>
      <div id="aErr" style="display:none;color:#f87171;font-size:13px;margin-bottom:10px;"></div>

async function saveAccess(barberId) {
  const email = document.getElementById('aEmail').value.trim().toLowerCase()
  const pass  = document.getElementById('aPass').value
  const errEl = document.getElementById('aErr')
  errEl.style.display = 'none'
  if (!email) { errEl.textContent = 'Informe o e-mail.'; errEl.style.display = 'block'; return }
  if (pass.length < 6) { errEl.textContent = 'A senha precisa de pelo menos 6 caracteres.'; errEl.style.display = 'block'; return }

  const btn = document.getElementById('aSave')
  btn.disabled = true; btn.textContent = 'Criando…'

  const acc = await createBarberAccount(email, pass)
  if (acc.err) {
    btn.disabled = false; btn.textContent = 'Criar acesso'
    errEl.textContent = acc.err
    errEl.style.display = 'block'; return
  }

  await db.from('barbers').update({ email, user_id: acc.userId }).eq('id', barberId)
  const b = barbers.find(x => x.id === barberId)
  if (b) { b.email = email; b.user_id = acc.userId }
  closeModal('accessModal')
  renderBarbeiros()
  alert(`✅ Acesso criado!\n\nPainel: ${window.location.origin}/painel/\nE-mail: ${email}\nSenha: ${pass}\n\nPasse esses dados ao barbeiro.`)
}

// ── Dias e horários por barbeiro ──
function timeOptions(selected) {
  let out = ''
  for (let h = 6; h <= 23; h++) {
    for (const m of ['00','30']) {
      if (h === 23 && m === '30') continue
      const t = String(h).padStart(2,'0') + ':' + m
      out += `<option value="${t}" ${t === selected ? 'selected' : ''}>${t}</option>`
    }
  }
  return out
}

async function openHoursModal(barberId) {
  const b = barbers.find(x => x.id === barberId)
  if (!b) return
  const { data: rows } = await db.from('availability').select('*').eq('barber_id', barberId)
  const byDay = {}
  ;(rows || []).forEach(r => { byDay[r.day_of_week] = r })

  const hasAny = (rows || []).length > 0
  const dayRows = DIAS_FULL.map((nome, d) => {
    const r = byDay[d]
    const on = r ? true : (!hasAny && d >= 1 && d <= 6) // padrão: seg a sáb
    const start = r ? String(r.start_time).slice(0,5) : '09:00'
    const end   = r ? String(r.end_time).slice(0,5)   : '19:00'
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);">
        <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;font-size:14px;">
          <input type="checkbox" id="hd-${d}" ${on ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--primary);">
          ${nome}
        </label>
        <select class="form-select" id="hs-${d}" style="width:auto;padding:8px 10px;">${timeOptions(start)}</select>
        <span style="color:var(--ink-3);font-size:13px;">às</span>
        <select class="form-select" id="he-${d}" style="width:auto;padding:8px 10px;">${timeOptions(end)}</select>
      </div>`
  }).join('')

  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'hoursModal'
  overlay.innerHTML = `
    <div class="modal" style="max-height:90dvh;overflow-y:auto;">
      <div class="modal-title">🕐 Horários — ${b.name}</div>
      <p style="font-size:13px;color:var(--ink-2);margin-bottom:12px;">Marque os dias que ${b.name} atende e o horário de cada dia.</p>
      ${dayRows}
      <div id="hoursErr" style="display:none;color:#f87171;font-size:13px;margin-top:10px;"></div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('hoursModal')">Cancelar</button>
        <button class="btn-modal-save" id="hoursSave" onclick="saveHours('${barberId}')">Salvar horários</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
}

async function saveHours(barberId) {
  const rows = []
  const errEl = document.getElementById('hoursErr')
  errEl.style.display = 'none'
  for (let d = 0; d < 7; d++) {
    if (!document.getElementById('hd-' + d).checked) continue
    const start = document.getElementById('hs-' + d).value
    const end   = document.getElementById('he-' + d).value
    if (end <= start) {
      errEl.textContent = `${DIAS_FULL[d]}: o horário de fechar precisa ser depois do de abrir.`
      errEl.style.display = 'block'; return
    }
    rows.push({ barber_id: barberId, day_of_week: d, start_time: start, end_time: end })
  }
  const btn = document.getElementById('hoursSave')
  btn.disabled = true; btn.textContent = 'Salvando…'

  // Agendamentos confirmados que ficariam fora do novo horário
  const { data: futuros } = await db.from('bookings')
    .select('id,date,start_time,client_name,client_phone')
    .eq('barber_id', barberId).eq('status', 'confirmed').gte('date', hojeBR())
  const conflitos = (futuros || []).filter(bk => {
    const dow = new Date(bk.date + 'T12:00:00').getDay()
    const novo = rows.find(r => r.day_of_week === dow)
    if (!novo) return true // dia foi desligado, mas tem cliente marcado nele
    const ini = String(bk.start_time).slice(0, 5)
    return ini < novo.start_time || ini >= novo.end_time
  })

  if (conflitos.length) {
    btn.disabled = false; btn.textContent = 'Salvar horários'
    const lista = conflitos.slice(0, 5)
      .map(bk => `${dataBR(bk.date)} às ${String(bk.start_time).slice(0, 5)} — ${bk.client_name}`)
      .join('<br>')
    const ok = await askConfirm(
      `⚠️ <strong>${conflitos.length} agendamento${conflitos.length > 1 ? 's' : ''}</strong> fica${conflitos.length > 1 ? 'm' : ''} fora do novo horário:<br><br>` +
      `${lista}${conflitos.length > 5 ? '<br>…e mais ' + (conflitos.length - 5) : ''}<br><br>` +
      `Salvar mesmo assim? Esses clientes serão <strong>desmarcados e avisados no WhatsApp</strong> para escolher um novo horário.`)
    if (!ok) return
    btn.disabled = true; btn.textContent = 'Salvando…'
  }

  const { error: delErr } = await db.from('availability').delete().eq('barber_id', barberId)
  if (delErr) {
    btn.disabled = false; btn.textContent = 'Salvar horários'
    errEl.textContent = 'Erro ao salvar: ' + delErr.message
    errEl.style.display = 'block'; return
  }
  if (rows.length) {
    const { error: insErr } = await db.from('availability').insert(rows)
    if (insErr) {
      btn.disabled = false; btn.textContent = 'Salvar horários'
      errEl.textContent = 'Erro ao salvar: ' + insErr.message
      errEl.style.display = 'block'; return
    }
  }

  // Desmarca e avisa quem ficou fora do novo horário
  if (conflitos.length) {
    btn.textContent = 'Avisando clientes…'
    const resultados = []
    for (const bk of conflitos) {
      const { error: cErr } = await db.from('bookings').update({ status: 'cancelled' }).eq('id', bk.id)
      let avisado = false
      if (!cErr) {
        try {
          const r = await fetch('/api/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ booking_id: bk.id, type: 'cancel_by_shop' }) })
          const d = await r.json().catch(() => ({}))
          avisado = !!d.sent
        } catch (e) {}
      }
      resultados.push({ bk, avisado })
    }
    closeModal('hoursModal')

    const linhas = resultados.map(({ bk, avisado }) => {
      const quando = `${dataBR(bk.date)} às ${String(bk.start_time).slice(0, 5)}`
      if (avisado) return `<div style="padding:8px 0;border-top:1px solid var(--border);font-size:14px;">✅ <strong>${bk.client_name}</strong> (${quando}) — avisado no WhatsApp</div>`
      const fone = String(bk.client_phone || '').replace(/\D/g, '')
      const wa = 'https://wa.me/' + (fone.startsWith('55') ? fone : '55' + fone) + '?text=' +
        encodeURIComponent(`Olá, ${bk.client_name}! Aqui é da ${shop.name}. Precisei mudar meus horários e seu agendamento de ${quando} foi desmarcado. Me desculpe! Você pode escolher um novo horário em: ${shop.slug}.navalhanobigode.com.br`)
      return `<div style="padding:8px 0;border-top:1px solid var(--border);font-size:14px;">📱 <strong>${bk.client_name}</strong> (${quando}) — <a href="${wa}" target="_blank" style="color:var(--primary);font-weight:600;">avisar manualmente</a></div>`
    }).join('')

    const o = document.createElement('div')
    o.className = 'modal-overlay'
    o.innerHTML = `
      <div class="modal" style="max-height:90dvh;overflow-y:auto;">
        <div class="modal-title">Horários salvos ✅</div>
        <p style="font-size:13px;color:var(--ink-2);margin-bottom:10px;">${resultados.length} cliente${resultados.length > 1 ? 's' : ''} desmarcado${resultados.length > 1 ? 's' : ''} para liberar o novo horário:</p>
        ${linhas}
        <div class="modal-actions">
          <button class="btn-modal-save" onclick="this.closest('.modal-overlay').remove()">Concluído</button>
        </div>
      </div>`
    document.body.appendChild(o)
    if (currentTab === 'agenda') { loadBookings(selectedDate); loadWeekOverview(); loadStats() }
    return
  }

  closeModal('hoursModal')
}

async function deleteBarber(id) {
  if (!confirm('Remover este barbeiro?')) return
  await db.from('barbers').delete().eq('id', id)
  barbers = barbers.filter(b => b.id !== id)
  renderBarbersList()
}

function closeModal(id) { document.getElementById(id)?.remove() }

// ── Comissões por barbeiro ──
let commMonth = new Date().toISOString().slice(0, 7) // YYYY-MM

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']

function fmtNum(v) {
  return Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.')
}

async function renderComissoes() {
  const content = document.getElementById('content')
  content.innerHTML = `
    <div class="section-header" style="margin-bottom:20px;">
      <div class="section-title">Comissões</div>
      <input class="date-input" type="month" id="commMonthInput" value="${commMonth}" onchange="changeCommMonth(this.value)">
    </div>
    <div id="commContent"><div class="loading-overlay"><div class="spinner"></div> Carregando…</div></div>`
  await loadComissoes()
}

function changeCommMonth(v) {
  commMonth = v
  loadComissoes()
}

async function loadComissoes() {
  const [ano, mes] = commMonth.split('-').map(Number)
  const from = `${commMonth}-01`
  const lastDay = new Date(ano, mes, 0).getDate()
  const to = `${commMonth}-${String(lastDay).padStart(2, '0')}`
  const el = document.getElementById('commContent')
  if (!el) return
  el.innerHTML = '<div class="loading-overlay"><div class="spinner"></div> Calculando…</div>'

  const { data: bks } = await db.from('bookings')
    .select('barber_id, barbers(id, name, commission_pct), services(price)')
    .eq('barbershop_id', shop.id)
    .in('status', ['confirmed', 'completed'])
    .gte('date', from)
    .lte('date', to)

  if (!bks) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Erro ao carregar</div></div>'
    return
  }

  // Agrega por barbeiro
  const byBarber = {}
  for (const bk of bks) {
    const bid = bk.barber_id
    if (!byBarber[bid]) {
      byBarber[bid] = {
        id: bid,
        name: bk.barbers?.name || '—',
        commission_pct: bk.barbers?.commission_pct ?? 50,
        count: 0,
        revenue: 0
      }
    }
    byBarber[bid].count++
    byBarber[bid].revenue += Number(bk.services?.price || 0)
  }

  // Garante que barbeiros sem agendamento no mês também aparecem
  for (const b of barbers.filter(b => b.active)) {
    if (!byBarber[b.id]) {
      byBarber[b.id] = {
        id: b.id,
        name: b.name,
        commission_pct: b.commission_pct ?? 50,
        count: 0,
        revenue: 0
      }
    }
  }

  const rows = Object.values(byBarber).sort((a, b) => b.revenue - a.revenue)
  const totalRevenue = rows.reduce((s, r) => s + r.revenue, 0)
  const totalComm = rows.reduce((s, r) => s + r.revenue * r.commission_pct / 100, 0)
  const mesNome = MESES[mes - 1]

  el.innerHTML = `
    <div class="stats-row" style="margin-bottom:20px;">
      <div class="stat-card">
        <div class="stat-label">Faturamento — ${mesNome}</div>
        <div class="stat-value gold">R$ ${fmtNum(totalRevenue)}</div>
        <div class="stat-sub">${rows.reduce((s, r) => s + r.count, 0)} atendimentos</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total a pagar</div>
        <div class="stat-value" style="color:var(--red);">R$ ${fmtNum(totalComm)}</div>
        <div class="stat-sub">em comissões</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Lucro líquido</div>
        <div class="stat-value" style="color:var(--green);">R$ ${fmtNum(totalRevenue - totalComm)}</div>
        <div class="stat-sub">após comissões</div>
      </div>
    </div>
    <div id="commTable">${rows.map(r => commRow(r)).join('')}</div>`
}

function commRow(r) {
  const comm = r.revenue * r.commission_pct / 100
  return `
    <div class="barber-card" id="crow-${r.id}">
      <div class="barber-avatar">💈</div>
      <div class="service-body" style="flex:1;min-width:0;">
        <div class="service-name">${r.name}</div>
        <div class="service-detail">${r.count} atendimento${r.count !== 1 ? 's' : ''} · faturou R$ ${fmtNum(r.revenue)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-shrink:0;">
        <div style="text-align:right;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-2);margin-bottom:2px;">Comissão</div>
          <div style="font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--primary);">${r.commission_pct}%</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-2);margin-bottom:2px;">A pagar</div>
          <div style="font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--red);">R$ ${fmtNum(comm)}</div>
        </div>
        <button class="action-btn" onclick="editComissao('${r.id}', ${r.commission_pct}, '${r.name.replace(/'/g, "\\'")}')">✏️ %</button>
      </div>
    </div>`
}

function editComissao(barberId, current, name) {
  const overlay = document.createElement('div')
  overlay.className = 'modal-overlay'
  overlay.id = 'commModal'
  overlay.innerHTML = `
    <div class="modal" style="max-width:360px;">
      <div class="modal-title">% Comissão — ${name}</div>
      <div class="form-group">
        <label class="form-label">Percentual de comissão</label>
        <input class="form-input" id="commPct" type="number" value="${current}" min="0" max="100" step="1" placeholder="Ex: 50">
        <div class="form-hint">Porcentagem do valor do serviço que vai pro profissional. Ex: 50 = metade do valor cobrado.</div>
      </div>
      <div id="commErr" style="display:none;color:#f87171;font-size:13px;margin-bottom:8px;"></div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('commModal')">Cancelar</button>
        <button class="btn-modal-save" id="commSave" onclick="saveComissao('${barberId}')">Salvar</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
  document.getElementById('commPct').focus()
  document.getElementById('commPct').select()
}

async function saveComissao(barberId) {
  const pct = parseFloat(document.getElementById('commPct').value)
  const errEl = document.getElementById('commErr')
  errEl.style.display = 'none'
  if (isNaN(pct) || pct < 0 || pct > 100) {
    errEl.textContent = 'Informe um valor entre 0 e 100.'
    errEl.style.display = 'block'; return
  }
  const btn = document.getElementById('commSave')
  btn.disabled = true; btn.textContent = 'Salvando…'

  const { error } = await db.from('barbers').update({ commission_pct: pct }).eq('id', barberId)
  if (error) {
    btn.disabled = false; btn.textContent = 'Salvar'
    errEl.textContent = 'Erro ao salvar: ' + error.message
    errEl.style.display = 'block'; return
  }

  // Atualiza cache local
  const b = barbers.find(x => x.id === barberId)
  if (b) b.commission_pct = pct

  closeModal('commModal')
  loadComissoes()
}

async function doLogout() {
  await db.auth.signOut()
  window.location.href = '/painel/login.html'
}
